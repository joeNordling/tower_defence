  function drawChar(c,o[],dir,opts={}){
    const{p,b}=mk(c,o,H_GW,H_GH,H_PX);
    const{lOff=0,rOff=0,atk=false,atkFrame=0,charge=false,leap=false,rage=false,rampage=false,hurt=false,armSwing=0}=opts;
    const cx=16;

    // Rampage fire aura
    if(rampage){
      for(let i=0;i<16;i++){const a=i*Math.PI/8;
        const r1=10+Math.round(Math.sin(i*2)*2);
        p(cx+Math.round(Math.cos(a)*r1),30+Math.round(Math.sin(a)*r1),i%2?C.ORNG:C.FLAME);
        p(cx+Math.round(Math.cos(a)*(r1-2)),30+Math.round(Math.sin(a)*(r1-2)),i%3===0?C.FLAME:C.HELL);
      }
      // Ground fire
      for(let x=4;x<28;x++){if(x%2===0)p(x,56,C.ORNG);if(x%3===0)p(x,57,C.EMBR);}
    }

    const lean=charge?3:leap?0:atk&&atkFrame>0?1:0;
    const headY=leap?3:charge?6:7;
    const torY=headY+8;
    const legY=torY+10;
    const bx_=cx+lean;

    // BODY BUILD — muscular, broad
    // Torso — wide, powerful
    b(bx_-4,torY,8,9,C.DPRED);b(bx_-3,torY,6,8,C.HELL);
    if(dir===0){
      // Chest muscles
      b(bx_-3,torY+1,3,3,C.ORNG);b(bx_+1,torY+1,3,3,C.ORNG);
      p(bx_,torY+1,C.DPRED); // center line
      // Abs
      p(bx_-1,torY+5,C.ORNG);p(bx_+1,torY+5,C.ORNG);
      p(bx_-1,torY+7,C.ORNG);p(bx_+1,torY+7,C.ORNG);
    } else if(dir===1){
      b(bx_-2,torY+1,4,3,C.ORNG);
      p(bx_,torY+5,C.ORNG);p(bx_,torY+7,C.ORNG);
    } else {
      // Back muscles
      b(bx_-3,torY+1,6,4,C.EMBR);
      p(bx_,torY+2,C.DPRED);p(bx_,torY+4,C.DPRED);
    }
    // Demon markings on torso
    if(rage||rampage){
      p(bx_-3,torY+2,C.FLAME);p(bx_+3,torY+2,C.FLAME);
      p(bx_-2,torY+5,C.ORNG);p(bx_+2,torY+5,C.ORNG);
    }
    // Belt/waist
    b(bx_-4,torY+8,8,1,C.DKASH);b(bx_-3,torY+8,6,1,C.CHAR);p(bx_,torY+8,C.EMBR);

    // HEAD — strong jaw, demon features
    if(dir===0){
      b(bx_-4,headY,8,7,C.HELL);b(bx_-3,headY,6,6,C.ORNG);
      // Brow ridge
      b(bx_-4,headY,8,2,C.DPRED);b(bx_-3,headY,6,1,C.EMBR);
      // Eyes — flames come from them
      p(bx_-2,headY+2,C.FLAME);p(bx_-1,headY+2,C.BRGHT);
      p(bx_+1,headY+2,C.FLAME);p(bx_+2,headY+2,C.BRGHT);
      // Flame trails from eyes
      p(bx_-3,headY+1,C.ORNG);p(bx_+3,headY+1,C.ORNG);
      if(rage||rampage){p(bx_-4,headY,C.FLAME);p(bx_+4,headY,C.FLAME);p(bx_-5,headY-1,C.ORNG);p(bx_+5,headY-1,C.ORNG);}
      // Nose
      p(bx_,headY+3,C.DPRED);
      // Jaw
      b(bx_-3,headY+5,6,2,C.DPRED);b(bx_-2,headY+5,4,1,C.HELL);
      // Mouth
      p(bx_-1,headY+6,C.DKBLD);p(bx_,headY+6,C.DKBLD);p(bx_+1,headY+6,C.DKBLD);
      // Short horns
      p(bx_-4,headY-1,C.DKASH);p(bx_-5,headY-2,C.CHAR);
      p(bx_+4,headY-1,C.DKASH);p(bx_+5,headY-2,C.CHAR);
    } else if(dir===1){
      b(bx_-3,headY,7,7,C.HELL);b(bx_-2,headY,5,6,C.ORNG);
      b(bx_-3,headY,7,2,C.DPRED);
      // One eye
      p(bx_+1,headY+2,C.FLAME);p(bx_+2,headY+2,C.BRGHT);
      p(bx_+3,headY+1,C.ORNG);
      if(rage||rampage){p(bx_+4,headY,C.FLAME);p(bx_+5,headY-1,C.ORNG);}
      p(bx_+1,headY+3,C.DPRED);
      b(bx_-2,headY+5,5,2,C.DPRED);
      p(bx_+1,headY+6,C.DKBLD);
      p(bx_+4,headY-1,C.DKASH);p(bx_+5,headY-2,C.CHAR);
    } else {
      b(bx_-4,headY,8,7,C.HELL);b(bx_-3,headY,6,6,C.EMBR);
      b(bx_-4,headY,8,2,C.DPRED);
      // Back of head
      p(bx_-1,headY+2,C.DPRED);p(bx_+1,headY+2,C.DPRED);
      b(bx_-3,headY+5,6,2,C.DPRED);
      p(bx_-4,headY-1,C.DKASH);p(bx_-5,headY-2,C.CHAR);
      p(bx_+4,headY-1,C.DKASH);p(bx_+5,headY-2,C.CHAR);
    }

    // ARMS & AXE
    if(atk){
      if(dir===0){
        // Massive axe swing down
        if(atkFrame===0){
          // Axe raised — arm up
          b(bx_+4,torY-4,3,6,C.HELL);b(bx_+5,torY-4,2,5,C.ORNG);
          // Axe head — big and brutal
          b(bx_+3,torY-8,6,4,C.GRAY);b(bx_+4,torY-8,4,3,C.LTSMK);
          p(bx_+3,torY-8,C.DKGRAY);p(bx_+8,torY-8,C.DKGRAY);
          // Axe edge glow
          p(bx_+3,torY-7,C.EMBR);p(bx_+8,torY-7,C.EMBR);
          // Handle
          b(bx_+5,torY-4,1,8,C.DKASH);
          // Left arm down
          b(bx_-6,torY+1,3,5,C.HELL);b(bx_-5,torY+1,2,4,C.ORNG);
        } else {
          // Axe smashing down
          b(bx_+4,torY+2,3,5,C.HELL);b(bx_+5,torY+2,2,4,C.ORNG);
          // Axe head at ground
          b(bx_+3,torY+8,6,4,C.GRAY);b(bx_+4,torY+9,4,3,C.LTSMK);
          p(bx_+3,torY+8,C.EMBR);p(bx_+8,torY+11,C.EMBR);
          // Impact sparks
          for(let i=0;i<5;i++){p(bx_+2+i*2,torY+12+Math.round(Math.sin(i)*1.5),i%2?C.FLAME:C.ORNG);}
          b(bx_+5,torY+4,1,5,C.DKASH);
          b(bx_-6,torY+3,3,4,C.HELL);
        }
      } else if(dir===1){
        if(atkFrame===0){
          // Axe wound up
          b(bx_+4,torY-3,3,5,C.HELL);
          b(bx_+2,torY-7,5,4,C.GRAY);b(bx_+3,torY-7,3,3,C.LTSMK);
          p(bx_+2,torY-6,C.EMBR);p(bx_+6,torY-6,C.EMBR);
          b(bx_+4,torY-3,1,6,C.DKASH);
        } else {
          // Axe swung forward
          b(bx_+4,torY+1,5,3,C.HELL);
          b(bx_+8,torY-1,4,5,C.GRAY);b(bx_+9,torY,3,3,C.LTSMK);
          p(bx_+8,torY-1,C.EMBR);p(bx_+11,torY+3,C.EMBR);
          b(bx_+5,torY+2,4,1,C.DKASH);
          // Slash trail
          for(let i=0;i<4;i++)p(bx_+7+i,torY-2+i,C.ORNG);
        }
      } else {
        if(atkFrame===0){
          b(bx_+4,torY-4,3,6,C.HELL);
          b(bx_+3,torY-8,5,4,C.GRAY);b(bx_+4,torY-8,3,3,C.LTSMK);
          b(bx_+4,torY-4,1,7,C.DKASH);
        } else {
          b(bx_+4,torY+3,3,4,C.HELL);
          b(bx_+3,torY+8,5,4,C.GRAY);b(bx_+4,torY+9,3,3,C.LTSMK);
          b(bx_+4,torY+4,1,5,C.DKASH);
        }
      }
    } else {
      // Idle/walk arms — muscular
      const aY=torY+1;
      if(dir===0){
        b(bx_-6,aY+armSwing,3,6,C.HELL);b(bx_-5,aY+armSwing,2,5,C.ORNG);
        b(bx_+4,aY-armSwing,3,6,C.HELL);b(bx_+5,aY-armSwing,2,5,C.ORNG);
        // Axe at side
        b(bx_+6,aY-armSwing+1,1,8,C.DKASH);
        b(bx_+5,aY-armSwing-2,3,3,C.GRAY);p(bx_+5,aY-armSwing-2,C.EMBR);
        // Fists
        b(bx_-6,aY+armSwing+5,2,2,C.DPRED);
        b(bx_+5,aY-armSwing+5,2,2,C.DPRED);
      } else if(dir===1){
        b(bx_+4,aY-armSwing,3,6,C.HELL);b(bx_+5,aY-armSwing,2,5,C.ORNG);
        b(bx_+6,aY-armSwing+1,1,8,C.DKASH);
        b(bx_+5,aY-armSwing-2,3,3,C.GRAY);p(bx_+5,aY-armSwing-2,C.EMBR);
        b(bx_+5,aY-armSwing+5,2,2,C.DPRED);
      } else {
        b(bx_-6,aY+armSwing,3,6,C.HELL);b(bx_-5,aY+armSwing,2,5,C.EMBR);
        b(bx_+4,aY-armSwing,3,6,C.HELL);b(bx_+5,aY-armSwing,2,5,C.EMBR);
        // Axe on back
        b(bx_-1,aY-4,1,10,C.DKASH);
        b(bx_-3,aY-6,4,3,C.GRAY);p(bx_-3,aY-5,C.EMBR);
      }
    }

    // LEGS — powerful
    const lh=10;
    b(bx_-3+lOff,legY,3,lh,C.DPRED);b(bx_-2+lOff,legY,2,lh-1,C.HELL);
    b(bx_+1+rOff,legY,3,lh,C.DPRED);b(bx_+2+rOff,legY,2,lh-1,C.HELL);
    // Knee guards
    b(bx_-3+lOff,legY+Math.floor(lh*0.5),3,1,C.DKASH);
    b(bx_+1+rOff,legY+Math.floor(lh*0.5),3,1,C.DKASH);
    // Boots — heavy
    const lfy=Math.min(legY+lh,61),rfy=Math.min(legY+lh,61);
    b(bx_-4+lOff,lfy,5,2,C.CHAR);b(bx_-3+lOff,lfy,4,1,C.DKASH);
    b(bx_+rOff,rfy,5,2,C.CHAR);b(bx_+1+rOff,rfy,4,1,C.DKASH);
    // Ground shadow
    if(!leap&&lfy+2<63){p(bx_-4+lOff,lfy+2,C.OBSID);p(bx_+4+rOff,rfy+2,C.OBSID);}

    // Demon skin markings — glowing veins
    if(rage){
      // Veins glow bright on arms and chest
      p(bx_-4,torY+2,C.FLAME);p(bx_+4,torY+2,C.FLAME);
      p(bx_-3,torY+4,C.ORNG);p(bx_+3,torY+4,C.ORNG);
      p(bx_-2,legY+2,C.ORNG);p(bx_+2,legY+2,C.ORNG);
      p(bx_-3,headY+3,C.FLAME);p(bx_+3,headY+3,C.FLAME);
    }

    // Leap slam — airborne
    if(leap){
      // Jump dust below
      for(let x=6;x<26;x++){if(x%2===0)p(x,58,C.ASH);if(x%3===0)p(x,59,C.DKASH);}
      // Impact target marker
      b(bx_-4,56,8,1,C.EMBR);b(bx_-3,55,6,1,C.HELL);
    }

    // Charge lean lines
    if(charge){
      for(let y=headY;y<legY+6;y+=3){p(bx_-8,y,C.ORNG);p(bx_-9,y+1,C.EMBR);}
    }

    // Hurt flash
    if(hurt){p(bx_+5,headY+1,C.HELL);p(bx_+6,headY,C.FLAME);p(bx_+7,headY+1,C.HELL);p(bx_+6,headY+2,C.ORNG);}
  }

  // Layout: 8 cols x 5 rows at 64x128
  // R0: Down  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R1: Side  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R2: Up    idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R3: Abilities — cleave sweep, blood rage, leap slam, rampage
  // R4: hurt, death1, death2, portrait

  const frames[]=[];
  for(let dir=0;dir<3;dir++){
    frames.push([
      {dir,opts:{}},
      {dir,opts:{armSwing:1}},
      {dir,opts:{lOff:2,rOff:-1,armSwing:1}},
      {dir,opts:{lOff:-1,rOff:2,armSwing:-1}},
      {dir,opts:{lOff:3,rOff:0,armSwing:1}},
      {dir,opts:{lOff:0,rOff:3,armSwing:-1}},
      {dir,opts:{atk:true,atkFrame:0,lOff:1}},
      {dir,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},
    ]);
  }
  // Abilities
  frames.push([
    {dir:0,opts:{atk:true,atkFrame:0,lOff:1}},                    // Cleave sweep 1
    {dir:0,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},            // Cleave sweep 2
    {dir:0,opts:{rage:true}},                                       // Blood rage 1 (veins glow)
    {dir:0,opts:{rage:true,armSwing:1}},                            // Blood rage 2
    {dir:0,opts:{leap:true,lOff:1,rOff:1}},                        // Leap slam 1
    {dir:0,opts:{leap:true,atk:true,atkFrame:1,lOff:2,rOff:-1}},  // Leap slam 2
    {dir:0,opts:{rampage:true}},                                    // Rampage 1 (fire aura)
    {dir:0,opts:{rampage:true,charge:true,lOff:2,rOff:1}},        // Rampage 2 (charging)
  ]);
  // States
  frames.push([
    {dir:0,opts:{hurt:true,lOff:-1,rOff:-1}},
    {dir:0,opts:{custom:'death1'}},
    {dir:0,opts:{custom:'death2'}},
    {dir:0,opts:{custom:'portrait'}},
    null,null,null,null,
  ]);

  const cols=8,rows=5;
  frames.forEach((row,ry)=>{
    row.forEach((frame,rx)=>{
      if(!frame)return;
      const o=[rx*H_CW,ry*H_CH];
      if(frame.opts.custom==='death1'){
        // Collapse in flames
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Body collapsed sideways
        b(7,32,5,4,C.DPRED);b(8,33,3,2,C.HELL);b(7,32,5,1,C.EMBR);p(9,34,C.ORNG);
        // Torso flat
        b(11,34,10,4,C.DPRED);b(12,34,8,3,C.HELL);
        // Legs sprawled
        b(21,36,6,2,C.DPRED);b(23,38,4,2,C.DPRED);
        // Axe dropped
        b(4,36,1,6,C.DKASH);b(3,35,3,2,C.GRAY);p(3,35,C.EMBR);
        // Flames consuming body
        iFlame(p,10,28,6,3,false);iFlame(p,16,29,5,2,false);iFlame(p,22,30,4,2,false);
        // Embers
        [[8,26,C.ORNG],[14,24,C.FLAME],[20,27,C.EMBR],[11,22,C.FLAME],[17,25,C.ORNG]].forEach(([x,y,cl])=>p(x,y,cl));
        // Ground scorch
        b(6,38,18,2,C.CHAR);
        for(let x=5;x<25;x++){if(x%3!==0)p(x,40,C.OBSID);if(x%4===0)p(x,41,C.CHAR);}
      } else if(frame.opts.custom==='death2'){
        // Burned remains + dissipating flame
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Scorched ground
        for(let x=6;x<26;x++){if(x%2===0)p(x,42,C.CHAR);if(x%3===0)p(x,41,C.OBSID);}
        // Ash pile
        b(10,39,12,3,C.ASH);b(11,39,10,2,C.DKASH);
        // Remaining embers
        p(12,38,C.EMBR);p(18,38,C.DPRED);p(15,37,C.EMBR);
        // Dissipating fire particles
        [[10,35],[14,32],[18,37],[12,28],[20,30],[8,33],[16,26],[22,28],[11,24],[15,22],[19,34],[13,38],[17,40],[9,36],[21,32],[14,20],[16,18],[12,16],[18,24],[10,30]].forEach(([x,y],i)=>{
          p(x,y,i%5===0?C.FLAME:i%4===0?C.ORNG:i%3===0?C.EMBR:i%2===0?C.DPRED:C.CHAR);
        });
        // Axe remains
        p(8,40,C.DKASH);p(7,40,C.GRAY);p(9,40,C.GRAY);
        p(15,42,C.EMBR);p(16,42,C.DPRED);
      } else if(frame.opts.custom==='portrait'){
        // Berserker portrait — close-up face
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Background — dark infernal
        b(2,2,28,60,C.DKBLD);b(3,3,26,58,C.OBSID);
        // Face — large
        b(6,8,20,16,C.HELL);b(7,9,18,14,C.ORNG);
        // Brow ridge — heavy
        b(6,8,20,4,C.DPRED);b(7,8,18,3,C.EMBR);b(8,7,16,2,C.DPRED);
        // Eyes — blazing with fire trails
        b(8,14,5,3,C.DKBLD);b(9,14,3,2,C.FLAME);b(10,14,1,2,C.BRGHT);p(10,14,C.WHITE);
        b(19,14,5,3,C.DKBLD);b(20,14,3,2,C.FLAME);b(21,14,1,2,C.BRGHT);p(21,14,C.WHITE);
        // Fire trailing from eyes
        p(7,13,C.ORNG);p(6,12,C.FLAME);p(5,11,C.ORNG);
        p(24,13,C.ORNG);p(25,12,C.FLAME);p(26,11,C.ORNG);
        // Nose
        p(15,17,C.DPRED);p(16,17,C.DPRED);p(15,18,C.DKBLD);p(16,18,C.DKBLD);
        // Jaw — strong
        b(7,20,18,4,C.DPRED);b(8,20,16,3,C.HELL);
        // Mouth — snarl
        b(11,21,10,2,C.DKBLD);b(12,21,8,1,C.DPRED);
        // Fangs
        p(12,22,C.SKULL);p(19,22,C.SKULL);
        // Horns at temples
        p(5,9,C.DKASH);p(4,8,C.CHAR);p(3,7,C.DKASH);
        p(26,9,C.DKASH);p(27,8,C.CHAR);p(28,7,C.DKASH);
        // Demon markings on face
        p(8,16,C.FLAME);p(9,18,C.ORNG);p(22,16,C.FLAME);p(23,18,C.ORNG);
        // Neck/shoulders
        b(6,24,20,8,C.DPRED);b(7,24,18,6,C.HELL);
        // Shoulder armor/markings
        b(4,26,4,6,C.DKASH);b(5,26,2,5,C.CHAR);b(24,26,4,6,C.DKASH);b(25,26,2,5,C.CHAR);
        // Chest markings
        p(12,28,C.FLAME);p(14,30,C.ORNG);p(16,28,C.FLAME);p(18,30,C.ORNG);
        // Axe handle visible
        b(25,30,2,14,C.DKASH);p(26,29,C.GRAY);p(25,28,C.EMBR);
        // Border — fiery
        b(2,2,28,1,C.EMBR);b(2,61,28,1,C.EMBR);b(2,2,1,60,C.EMBR);b(29,2,1,60,C.EMBR);
        p(3,3,C.FLAME);p(28,3,C.FLAME);p(3,60,C.FLAME);p(28,60,C.FLAME);
      } else {
        drawChar(ctx,o,frame.dir,frame.opts);
      }
    });
  });
  return{cols,rows,cw:H_CW,ch:H_CH};
}

// ===== LABELS =====
const T_NAMES=['Imp','Hellfire','Soul Drain','Fiend','Immolate','Apocalypse'];
const T_STATES=['Idle','Charge','Fire','Cooldown'];
const P_NAMES=['Imp','Hellfire','Soul Drain','Fiend','Immolate','Apocalypse'];
const P_STATES=['Travel 1','Travel 2','Travel 3','Impact 1','Impact 2','Impact 3'];
const H_COL_LABELS=['Idle 1','Idle 2','Walk 1','Walk 2','Walk 3','Walk 4','Atk 1','Atk 2'];
const H_ROW_LABELS=['Down','Side','Up','Abilities','States'];
const H_R3=['Cleave 1','Cleave 2','Rage 1','Rage 2','Leap 1','Leap 2','Rampage 1','Rampage 2'];
const H_R4=['Hurt','Death 1','Death 2','Portrait','','','',''];

// ===== COMPONENT =====
window._faction_infernal = function App(){
  const tRef=useRef(null),tPv=useRef(null),pRef=useRef(null),pPv=useRef(null),hRef=useRef(null),hPv=useRef(null);
  const [ready,setReady]=useState(false);
  const [tab,setTab]=useState('towers');
  const [view,setView]=useState('preview');

  useEffect(()=>{
    // Towers
    const tc=tRef.current!;tc.width=6*T_CELL;tc.height=4*T_CELL;
    const tCtx=tc.getContext('2d')!;tCtx.imageSmoothingEnabled=false;
    drawTowers(tCtx);
    // Tower preview
    const tpv=tPv.current!;const tS=2,tLW=66,tLH=13;
    tpv.width=tLW+6*T_CELL*tS;tpv.height=4*(T_CELL*tS+tLH)+10;
    const tpc=tpv.getContext('2d')!;tpc.imageSmoothingEnabled=false;
    tpc.fillStyle='#0a0000';tpc.fillRect(0,0,tpv.width,tpv.height);

    setReady(true);

// ===== PALETTE =====
const C={
  PGOLD:'#ffffaa',WHITE:'#ffffff',GOLD:'#ffdd44',DKBRN:'#443300',HOLY:'#ffeecc',WHOLY:'#fff8ee',
  LTGLD:'#ffee88',DKGLD:'#bb9922',DEEPGLD:'#886611',CREAM:'#fff5dd',
  MARBLE:'#eeeedd',LTMARB:'#fffff0',DKMARB:'#ccccaa',GRAYMARB:'#aaaaaa',
  BLUE:'#aaddff',LTBLUE:'#cceeFF',DKBLUE:'#6699cc',
  AMBER:'#ffaa33',LTYEL:'#ffffdd',BRIGHTYEL:'#ffff88',
  SKY:'#eeeeff',SHADOW:'#665544',DKSHADOW:'#332211',
  ARMOR:'#ddcc88',LTARMOR:'#eedd99',DKARMOR:'#aa9955',DEEPARMOR:'#887733',
  CAPE:'#eeeeee',DKCAPE:'#cccccc',DEESCAPE:'#aaaaaa',
  SKIN:'#ffddbb',DKSKIN:'#ddbb99',
};

// ===== DRAWING HELPERS =====
const mk=(c,o[],gw,gh,ps)=>{
  const p=(x,y,cl)=>{if(!cl||x<0||x>=gw||y<0||y>=gh)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,ps,ps);};
  const b=(x,y,w,h,cl)=>{if(!cl)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,w*ps,h*ps);};
  return{p,b};
};

// ===== TOWER HELPERS =====
const T_PX=2,T_G=32,T_CELL=T_G*T_PX;

function tPedestal(p,b,topY,w,glow){
  const cx=16;
  // White marble pedestal
  for(let i=0;i<8;i++){
    const cw=w-4+Math.floor(i*0.6),sx=cx-Math.floor(cw/2);
    b(sx,topY+i,cw,1,i<2?C.LTMARB:i<4?C.MARBLE:i<6?C.DKMARB:C.GRAYMARB);
  }
  // Golden trim on top
  b(cx-Math.floor((w-4)/2),topY,w-4,1,C.GOLD);
  b(cx-Math.floor((w-4)/2),topY+1,w-4,1,C.LTGLD);
  // Golden accents on sides
  p(cx-Math.floor(w/2)+1,topY+3,C.GOLD);p(cx+Math.floor(w/2)-2,topY+3,C.GOLD);
  // Upward light rays
  if(glow>0){
    p(cx-2,topY-1,C.LTYEL);p(cx+1,topY-1,C.LTYEL);
    if(glow>1){p(cx,topY-2,C.BRIGHTYEL);p(cx-1,topY-2,C.PGOLD);}
  }
  // Base shadow
  b(cx-Math.floor((w-2)/2),topY+7,w-2,1,C.SHADOW);
}

function tHalo(p,cx,cy,r,bright){
  // Radiant halo ring
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    const x=cx+Math.round(Math.cos(a)*r);
    const y=cy+Math.round(Math.sin(a)*r);
    p(x,y,bright?C.WHITE:i%2===0?C.GOLD:C.LTGLD);
  }
}

function tLightRay(p,x,y1,y2,col,bright){
  for(let y=y1;y<=y2;y++){
    p(x,y,y%2===0?bright:col);
  }
}

function tSpire(p,b,x,y,h,w,c1,c2,ct){
  for(let i=0;i<h;i++){
    const pr=i/h,cw=Math.max(1,Math.round(w*(1-pr*0.85)));
    b(x+Math.floor((w-cw)/2),y+h-1-i,cw,1,pr<0.15?ct:pr<0.5?c2:c1);
  }
}

          p(16+Math.round(Math.cos(a)*r2),13+Math.round(Math.sin(a)*r2),C.PGOLD);
        }
        // Cross pattern light
        tLightRay(p,16,0,5,C.LTYEL,C.WHITE);
        for(let x=5;x<28;x+=2)p(x,13,x%4===0?C.WHITE:C.PGOLD);
        b(15,0,2,2,C.WHITE);
        // Expanding ring
        for(let i=0;i<12;i++){const a=i*Math.PI/6;p(16+Math.round(Math.cos(a)*12),13+Math.round(Math.sin(a)*10),C.LTYEL);}
      }
      // Halo above main spire
      tHalo(p,16,3,3,fl);
      // Golden trim on body
      b(8,22,16,1,C.GOLD);p(8,22,C.LTGLD);p(23,22,C.LTGLD);
      // Buttress details
      b(6,18,2,6,C.DKMARB);b(24,18,2,6,C.DKMARB);
      p(6,18,C.GOLD);p(25,18,C.GOLD);
      if(s===3){p(15,17,C.DKGLD);p(16,18,C.DKGLD);b(15,0,2,2,C.SHADOW);}
    },
  ];
  const cols=5,rows=4;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*T_CELL,row*T_CELL],row);
  return{cols,rows,cell:T_CELL};
}

// ===== PROJECTILES (5×6 at 32×32) =====
const P_PX=2,P_G=16,P_CELL=P_G*P_PX;

function drawProjectiles(ctx){
  const fns=[
    // Acolyte: golden light mote → gentle heal flash
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Traveling golden light mote
        const bob=[0,-1,1][f];
        const r=2;
        for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r){
          const d=Math.sqrt(x*x+y*y);
          p(cx+x,cy+y+bob,d<1?C.WHITE:d<r*0.6?C.PGOLD:C.LTGLD);
        }
        // Trailing sparkle
        p(cx-3-f,cy+1,C.PGOLD);p(cx-2-f,cy-1,f>0?C.LTYEL:C.PGOLD);
        p(cx+3,cy+bob,C.LTYEL);
      } else if(f===3){
        // Impact: heal flash expanding
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),i%2?C.PGOLD:C.LTYEL);}
        b(cx-1,cy-1,3,3,C.PGOLD);p(cx,cy,C.WHITE);
        for(let i=0;i<4;i++){const a=i*Math.PI/2;p(cx+Math.round(Math.cos(a)*2),cy+Math.round(Math.sin(a)*2),C.WHITE);}
      } else if(f===4){
        // Heal flash mid
        for(let i=0;i<12;i++){const a=i*Math.PI/6;p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),i%2?C.LTGLD:C.PGOLD);}
        for(let i=0;i<6;i++){const a=i*Math.PI/3;p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.LTYEL);}
        p(cx,cy,C.WHITE);p(cx+1,cy,C.PGOLD);p(cx-1,cy,C.PGOLD);
      } else {
        // Fading particles
        [[4,5],[11,4],[6,10],[9,3],[3,8],[12,9],[7,6],[10,11]].forEach(([x,y],i)=>p(x,y,i%3===0?C.PGOLD:i%2?C.LTGLD:C.LTYEL));
      }
    },
    // Ward: white barrier pulse → mute wave (silence rings)
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Traveling barrier pulse
        const phase=f;
        const r=[3,4,3][f];
        for(let i=0;i<8;i++){
          const a=i*Math.PI/4+phase*0.3;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%2===0?C.WHITE:C.PGOLD);
        }
        b(cx-1,cy-1,2,2,C.WHITE);p(cx,cy,C.LTYEL);
        // Pulse trail
        if(f>0){p(cx-4,cy,C.PGOLD);p(cx-3,cy+1,C.HOLY);}
      } else if(f===3){
        // Impact: silence ring expanding
        for(let i=0;i<12;i++){const a=i*Math.PI/6;p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),C.WHITE);}
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.PGOLD);}
        p(cx,cy,C.WHITE);
        // X mute symbol
        p(cx-1,cy-1,C.GOLD);p(cx+1,cy-1,C.GOLD);p(cx-1,cy+1,C.GOLD);p(cx+1,cy+1,C.GOLD);
      } else if(f===4){
        // Double silence ring
        for(let i=0;i<12;i++){const a=i*Math.PI/6;
          p(cx+Math.round(Math.cos(a)*6),cy+Math.round(Math.sin(a)*6),i%2?C.PGOLD:C.HOLY);
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.WHITE);
        }
        p(cx,cy,C.LTYEL);
      } else {
        // Fading mute particles
        [[3,4],[12,5],[5,11],[10,3],[7,7],[4,9],[11,8]].forEach(([x,y],i)=>p(x,y,i%2?C.PGOLD:C.HOLY));
        p(cx,cy,C.DKMARB);
      }
    },
    // Smite: holy bolt downward → holy explosion (cross pattern)
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Holy bolt traveling down
        const yOff=[-2,0,2][f];
        for(let i=0;i<8;i++){
          const x_=cx+Math.round(Math.sin(i*0.5)*1);
          p(x_,cy-4+i+yOff,i<2?C.WHITE:i<4?C.BRIGHTYEL:i<6?C.GOLD:C.LTGLD);
        }
        p(cx,cy-5+yOff,C.WHITE);p(cx-1,cy-3+yOff,C.PGOLD);p(cx+1,cy-3+yOff,C.PGOLD);
      } else if(f===3){
        // Holy explosion - cross pattern
        // Vertical
        for(let i=-5;i<=5;i++)p(cx,cy+i,Math.abs(i)<2?C.WHITE:Math.abs(i)<4?C.BRIGHTYEL:C.GOLD);
        // Horizontal
        for(let i=-5;i<=5;i++)p(cx+i,cy,Math.abs(i)<2?C.WHITE:Math.abs(i)<4?C.BRIGHTYEL:C.GOLD);
        p(cx,cy,C.WHITE);
      } else if(f===4){
        // Expanded cross with diagonal
        for(let i=-6;i<=6;i++){p(cx,cy+i,Math.abs(i)<3?C.PGOLD:C.LTGLD);p(cx+i,cy,Math.abs(i)<3?C.PGOLD:C.LTGLD);}
        // Diagonals
        for(let i=1;i<5;i++){p(cx+i,cy+i,C.GOLD);p(cx-i,cy+i,C.GOLD);p(cx+i,cy-i,C.GOLD);p(cx-i,cy-i,C.GOLD);}
        p(cx,cy,C.LTYEL);
      } else {
        // Fading cross remnants
        for(let i=-3;i<=3;i++){if(i!==0){p(cx,cy+i,C.DKGLD);p(cx+i,cy,C.DKGLD);}}
        p(cx,cy,C.LTGLD);
        [[4,4],[12,4],[4,12],[12,12]].forEach(([x,y])=>p(x,y,C.DEEPGLD));
      }
    },
    // Sanctuary: absorbing light spiral → protection dome flash
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Spiraling inward light
        const phase=f*2;
        for(let i=0;i<10;i++){
          const a=(i+phase)*Math.PI/5;
          const r=6-i*0.5;
          if(r>0)p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i<3?C.PGOLD:i<6?C.LTYEL:C.WHITE);
        }
        p(cx,cy,f===2?C.WHITE:C.PGOLD);
        if(f>0)p(cx,cy,C.WHITE);
      } else if(f===3){
        // Protection dome flash
        for(let i=0;i<12;i++){
          const a=i*Math.PI/6;
          p(cx+Math.round(Math.cos(a)*6),cy+Math.round(Math.sin(a)*4),C.PGOLD);
          p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*3),C.LTYEL);
        }
        // Dome top arc
        for(let x=-4;x<=4;x++){
          const y_=cy-Math.round(Math.sqrt(16-x*x)*0.8);
          p(cx+x,y_,C.WHITE);
        }
        b(cx-1,cy-1,3,3,C.LTYEL);p(cx,cy,C.WHITE);
      } else if(f===4){
        // Dome expanding
        for(let i=0;i<16;i++){const a=i*Math.PI/8;
          p(cx+Math.round(Math.cos(a)*7),cy+Math.round(Math.sin(a)*5),i%2?C.PGOLD:C.HOLY);
        }
        for(let x=-5;x<=5;x++){
          const y_=cy-Math.round(Math.sqrt(25-x*x)*0.7);
          p(cx+x,y_,x%2===0?C.WHITE:C.PGOLD);
        }
        p(cx,cy,C.LTYEL);
      } else {
        // Fading dome particles
        [[5,3],[11,4],[3,7],[13,8],[7,12],[9,2],[6,10],[10,6]].forEach(([x,y],i)=>p(x,y,i%3===0?C.PGOLD:i%2?C.HOLY:C.LTYEL));
      }
    },
    // Absolution: massive holy beam → divine nova (expanding cross + rings)
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Massive holy beam traveling
        const w=[2,3,4][f];
        b(cx-Math.floor(w/2),0,w,16,C.LTYEL);
        b(cx-Math.floor(w/2)+1,0,Math.max(1,w-2),16,C.PGOLD);
        if(w>2)b(cx,0,1,16,C.WHITE);
        // Side glow
        p(cx-Math.floor(w/2)-1,cy-2,C.PGOLD);p(cx+Math.floor(w/2)+1,cy+2,C.PGOLD);
        p(cx-Math.floor(w/2)-1,cy+3,C.LTYEL);p(cx+Math.floor(w/2)+1,cy-3,C.LTYEL);
      } else if(f===3){
        // Divine nova: expanding cross + inner ring
        // Cross
        for(let i=-7;i<=7;i++){p(cx+i,cy,Math.abs(i)<3?C.WHITE:Math.abs(i)<5?C.BRIGHTYEL:C.GOLD);p(cx,cy+i,Math.abs(i)<3?C.WHITE:Math.abs(i)<5?C.BRIGHTYEL:C.GOLD);}
        // Inner ring
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),C.PGOLD);}
        p(cx,cy,C.WHITE);
      } else if(f===4){
        // Full divine nova: cross + double ring
        for(let i=-7;i<=7;i++){p(cx+i,cy,Math.abs(i)<2?C.PGOLD:C.LTGLD);p(cx,cy+i,Math.abs(i)<2?C.PGOLD:C.LTGLD);}
        // Diagonals
        for(let i=1;i<6;i++){p(cx+i,cy+i,C.GOLD);p(cx-i,cy+i,C.GOLD);p(cx+i,cy-i,C.GOLD);p(cx-i,cy-i,C.GOLD);}
        // Outer ring
        for(let i=0;i<12;i++){const a=i*Math.PI/6;p(cx+Math.round(Math.cos(a)*7),cy+Math.round(Math.sin(a)*7),i%2?C.PGOLD:C.LTYEL);}
        // Inner ring
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.WHITE);}
        p(cx,cy,C.LTYEL);
      } else {
        // Fading nova remnants
        for(let i=0;i<8;i++){const a=i*Math.PI/4;
          p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),i%2?C.DEEPGLD:C.DKGLD);
          p(cx+Math.round(Math.cos(a)*2),cy+Math.round(Math.sin(a)*2),C.LTGLD);
        }
        p(cx,cy,C.DKGLD);
      }
    },
  ];
  const cols=5,rows=6;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*P_CELL,row*P_CELL],row);
  return{cols,rows,cell:P_CELL};
}

// ===== HERO (8×5 at 64×128) =====
const H_PX=2,H_GW=32,H_GH=64,H_CW=H_GW*H_PX,H_CH=H_GH*H_PX;

function drawHero(ctx){
  // Paladin — armored holy knight, golden plate armor, white cape, glowing mace/hammer
  function drawChar(c,o[],dir,opts={}){
    const{p,b}=mk(c,o,H_GW,H_GH,H_PX);
    const{lOff=0,rOff=0,atk=false,atkFrame=0,smite=false,shield=false,consecrate=false,judgment=false,hurt=false,armSwing=0}=opts;
    const cx=16;

    // Judgment ascending light
    if(judgment){
      for(let x=-3;x<=3;x++)for(let y=0;y<64;y++){
        if((x+y)%4===0)p(cx+x,y,y<20?C.WHITE:y<40?C.PGOLD:C.LTYEL);
      }
      for(let i=0;i<10;i++){const a=i*Math.PI/5;p(cx+Math.round(Math.cos(a)*8),30+Math.round(Math.sin(a)*8),C.PGOLD);}
    }

    // Consecration ground AoE
    if(consecrate){
      b(cx-10,52,20,4,C.DKGLD);b(cx-9,52,18,3,C.GOLD);b(cx-8,53,16,1,C.LTGLD);
      for(let i=0;i<16;i++){const a=i*Math.PI/8;p(cx+Math.round(Math.cos(a)*10),54+Math.round(Math.sin(a)*3),i%2?C.GOLD:C.LTGLD);}
      // Holy runes on ground
      p(cx-5,53,C.PGOLD);p(cx+5,53,C.PGOLD);p(cx,52,C.WHITE);
    }

    const lean=smite?1:atk&&atkFrame>0?1:0;
    const headY=smite?6:8;
    const torY=headY+8;
    const legY=torY+10;
    const bx_=cx+lean;

    // WHITE CAPE (behind body)
    if(dir===2||dir===0){
      const cY=torY+1,sp=smite?2:judgment?3:1;
      for(let i=0;i<16;i++){
        const w=5+Math.floor(i*0.4)+sp,sx_=bx_-Math.floor(w/2)+Math.round(Math.sin(i*0.25)*0.5);
        const cl=i<3?C.CAPE:i<8?C.DKCAPE:i<12?C.DEESCAPE:C.GRAYMARB;
        for(let x=0;x<w;x++){const px_=sx_+x;if(px_>=0&&px_<32&&cY+i<62)p(px_,cY+i,cl);}
      }
      // Cape edge highlights
      for(let i=0;i<12;i++){
        const w=5+Math.floor(i*0.4)+sp,sx_=bx_-Math.floor(w/2);
        if(cY+i<62){p(sx_,cY+i,C.WHITE);if(sx_+w-1<32)p(sx_+w-1,cY+i,i%3===0?C.WHITE:C.CAPE);}

    }

    // HELMET
    if(dir===0){

      b(bx_-3,headY-1,6,1,C.GOLD);b(bx_-2,headY-2,4,1,C.LTGLD);

      // Eyes through visor
      const eg=smite||judgment;
      p(bx_-1,headY+3,eg?C.WHITE:C.PGOLD);p(bx_+1,headY+3,eg?C.WHITE:C.PGOLD);
      // Cheek guards
      b(bx_-4,headY+3,1,3,C.DKARMOR);b(bx_+4,headY+3,1,3,C.DKARMOR);
      // Halo above helmet
      tHalo(p,bx_,headY-5,4,eg);
    } else if(dir===1){
      // Side - helmet profile
      b(bx_-3,headY,7,3,C.ARMOR);b(bx_-2,headY,5,2,C.LTARMOR);
      b(bx_-2,headY-1,5,1,C.GOLD);b(bx_-1,headY-2,3,1,C.LTGLD);
      p(bx_,headY-3,C.WHITE);
      b(bx_-2,headY+3,5,2,C.DKBRN);b(bx_-1,headY+3,3,1,C.DKSHADOW);
      const eg=smite||judgment;
      p(bx_+1,headY+3,eg?C.WHITE:C.PGOLD);
      b(bx_+4,headY+2,1,3,C.DKARMOR);
      tHalo(p,bx_,headY-5,4,eg);
    } else {
      // Back - helmet rear
      b(bx_-4,headY,8,5,C.ARMOR);b(bx_-3,headY,6,4,C.LTARMOR);

      tHalo(p,bx_,headY-5,4,false);

    // GORGET (neck armor)
    b(bx_-4,torY-1,8,2,C.GOLD);b(bx_-3,torY-1,6,1,C.LTGLD);

    // TORSO — golden plate armor
    b(bx_-4,torY,8,9,C.ARMOR);b(bx_-3,torY,6,9,C.LTARMOR);
    if(dir===0){
      // Chest cross emblem
      p(bx_,torY+1,C.WHITE);p(bx_-1,torY+2,C.GOLD);p(bx_,torY+2,C.WHITE);p(bx_+1,torY+2,C.GOLD);
      p(bx_,torY+3,C.GOLD);p(bx_,torY+4,C.DKGLD);
      // Plate lines
      p(bx_-3,torY+2,C.DKARMOR);p(bx_+3,torY+2,C.DKARMOR);

          p(bx_+5,torY-12,C.WHITE); // hammer glow

        } else {

          // Light trail from swing
          for(let i=0;i<6;i++){p(bx_+5+Math.floor(i*0.3),torY-2+Math.floor(i*2.5),i<2?C.WHITE:C.PGOLD);}

          for(let i=0;i<6;i++){const a=i*Math.PI/3;p(bx_+5+Math.round(Math.cos(a)*3),torY+14+Math.round(Math.sin(a)*2),C.BRIGHTYEL);}

          for(let i=0;i<3;i++)p(bx_+5,torY-12-i,C.PGOLD);

          b(bx_+5,torY+10,3,3,C.GOLD);p(bx_+6,torY+10,C.LTGLD);
        }
      } else {
        if(atkFrame===0){
          b(bx_+4,torY-4,3,6,C.ARMOR);
          b(bx_+4,torY-8,3,4,C.DKBRN);b(bx_+3,torY-12,5,3,C.GOLD);b(bx_+4,torY-12,3,3,C.LTGLD);
          for(let i=0;i<3;i++)p(bx_+5,torY-13-i,C.PGOLD);
        } else {
          b(bx_+4,torY+3,3,6,C.ARMOR);
          b(bx_+4,torY+9,3,4,C.DKBRN);b(bx_+3,torY+13,5,3,C.GOLD);
          for(let i=0;i<5;i++)p(bx_+5,torY+16+i,i<2?C.BRIGHTYEL:C.GOLD);
        }
      }
    } else {
      // Idle/walk arms with hammer at side
      const aY=torY+1;
      if(dir===0){
        // Both arms visible
        b(bx_-6,aY+armSwing,2,6,C.ARMOR);p(bx_-6,aY+armSwing,C.LTARMOR);
        b(bx_+4,aY-armSwing,2,6,C.ARMOR);p(bx_+5,aY-armSwing,C.LTARMOR);
        // Hammer at right side
        for(let i=0;i<5;i++)p(bx_+6,aY-armSwing+3+i,i===0?C.DKBRN:C.DKBRN);
        b(bx_+5,aY-armSwing+8,3,3,C.GOLD);b(bx_+6,aY-armSwing+8,1,3,C.LTGLD);
      } else if(dir===1){
        b(bx_+4,aY-armSwing,2,6,C.ARMOR);p(bx_+5,aY-armSwing,C.LTARMOR);
        for(let i=0;i<5;i++)p(bx_+6,aY-armSwing+3+i,C.DKBRN);
        b(bx_+5,aY-armSwing+8,3,3,C.GOLD);b(bx_+6,aY-armSwing+8,1,3,C.LTGLD);
      } else {
        b(bx_-6,aY+armSwing,2,6,C.ARMOR);p(bx_-6,aY+armSwing,C.LTARMOR);
        b(bx_+4,aY-armSwing,2,6,C.ARMOR);p(bx_+5,aY-armSwing,C.LTARMOR);
      }
    }

    // Smite blast effect
    if(smite){
      // Lightning from above
      for(let y=0;y<headY-5;y++){
        const x_=bx_+Math.round(Math.sin(y*0.7)*2);
        p(x_,y,y%2===0?C.WHITE:C.BRIGHTYEL);
        p(x_-1,y,C.PGOLD);
      }
      // Sparks around
      for(let i=0;i<6;i++){const a=i*Math.PI/3;p(bx_+Math.round(Math.cos(a)*6),headY+Math.round(Math.sin(a)*4),C.BRIGHTYEL);}
    }

    // LEGS — armored greaves
    const lh=10;
    b(bx_-3+lOff,legY,3,lh,C.ARMOR);p(bx_-2+lOff,legY,C.LTARMOR);
    b(bx_+1+rOff,legY,3,lh,C.ARMOR);p(bx_+2+rOff,legY,C.LTARMOR);
    // Knee guards
    b(bx_-3+lOff,legY+Math.floor(lh*0.4),3,1,C.GOLD);
    b(bx_+1+rOff,legY+Math.floor(lh*0.4),3,1,C.GOLD);
    // Armored boots
    const lfy=Math.min(legY+lh,61),rfy=Math.min(legY+lh,61);
    b(bx_-4+lOff,lfy,5,2,C.DKARMOR);b(bx_-3+lOff,lfy,4,1,C.ARMOR);
    b(bx_+rOff,rfy,5,2,C.DKARMOR);b(bx_+1+rOff,rfy,4,1,C.ARMOR);
    // Ground glow
    if(!smite&&lfy+2<63){p(bx_-3+lOff,lfy+2,C.PGOLD);p(bx_+3+rOff,rfy+2,C.PGOLD);}

    // Hurt flash
    if(hurt){p(bx_+5,headY+1,C.GOLD);p(bx_+6,headY,C.WHITE);p(bx_+7,headY+1,C.GOLD);p(bx_+6,headY+2,C.WHITE);}
  }

  // Layout: 8 cols × 5 rows at 64×128
  // R0: Down  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R1: Side  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R2: Up    idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R3: Abilities smite1,smite2,shield1,shield2,consecrate1,consecrate2,judgment1,judgment2
  // R4: hurt,death1,death2,portrait,x,x,x,x

  const frames[]=[];
  // Per-direction rows
  for(let dir=0;dir<3;dir++){
    frames.push([
      {dir,opts:{}},
      {dir,opts:{armSwing:1}},
      {dir,opts:{lOff:1,rOff:-1,armSwing:1}},
      {dir,opts:{lOff:-1,rOff:1,armSwing:-1}},
      {dir,opts:{lOff:2,rOff:0,armSwing:1}},
      {dir,opts:{lOff:0,rOff:2,armSwing:-1}},
      {dir,opts:{atk:true,atkFrame:0,lOff:1}},
      {dir,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},
    ]);
  }
  // Abilities row
  frames.push([
    {dir:0,opts:{smite:true,atk:true,atkFrame:0,lOff:1}},
    {dir:0,opts:{smite:true,atk:true,atkFrame:1,lOff:2,rOff:-1}},
    {dir:0,opts:{shield:true}},
    {dir:0,opts:{shield:true,armSwing:1}},
    {dir:0,opts:{consecrate:true,lOff:1}},
    {dir:0,opts:{consecrate:true,lOff:-1,rOff:1,armSwing:1}},
    {dir:0,opts:{judgment:true}},
    {dir:0,opts:{judgment:true,lOff:1,rOff:-1,armSwing:1}},
  ]);
  // States row
  frames.push([
    {dir:0,opts:{hurt:true,lOff:-1,rOff:-1}},
    {dir:0,opts:{custom:'death1'}},
    {dir:0,opts:{custom:'death2'}},
    {dir:0,opts:{custom:'portrait'}},
    null,null,null,null,
  ]);

  const cols=8,rows=5;
  frames.forEach((row[],ry)=>{
    row.forEach((frame,rx)=>{
      if(!frame)return;
      const o=[rx*H_CW,ry*H_CH];
      if(frame.opts.custom==='death1'){
        // Ascending in light — body dissolving upward
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Fallen body
        b(7,34,5,4,C.ARMOR);b(8,35,3,2,C.LTARMOR);b(7,34,5,1,C.GOLD);
        b(11,36,10,4,C.ARMOR);b(12,36,8,3,C.LTARMOR);
        // Cape spread
        b(4,37,3,2,C.CAPE);b(3,38,2,1,C.DKCAPE);p(2,39,C.DEESCAPE);
        // Hammer beside body
        b(21,38,6,2,C.DKBRN);b(22,36,4,3,C.GOLD);p(23,36,C.LTGLD);
        // Ground
        b(5,40,22,2,C.DKMARB);b(6,41,20,1,C.GRAYMARB);
        // Ascending light particles
        for(let i=0;i<12;i++){
          const x_=8+Math.floor(Math.random()*16);
          const y_=24+i*2;
          p(x_,y_,i<4?C.WHITE:i<8?C.PGOLD:C.LTYEL);
        }
        // Rising sparkles above body
        [[10,28],[14,26],[18,24],[12,22],[16,20],[11,18],[15,16],[13,14]].forEach(([x,y],i)=>{
          p(x,y,i%3===0?C.WHITE:i%2===0?C.PGOLD:C.LTYEL);
        });
        // Light beam above
        b(14,8,4,14,C.LTYEL);b(15,8,2,14,C.PGOLD);p(15,8,C.WHITE);p(16,10,C.WHITE);
      } else if(frame.opts.custom==='death2'){
        // Fully ascended — only light remains
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Ground mark
        for(let x=8;x<24;x++){if(x%2===0)p(x,46,C.DKMARB);if(x%3===0)p(x,45,C.GRAYMARB);}
        // Hammer left behind
        b(12,42,3,3,C.GOLD);b(14,43,2,4,C.DKBRN);p(13,42,C.LTGLD);
        // Ascending particles all the way up
        [[10,38],[14,34],[18,36],[12,30],[16,28],[11,24],[15,20],[13,16],[17,12],[14,8],[16,4],[12,2]].forEach(([x,y],i)=>{
          p(x,y,i%5===0?C.WHITE:i%3===0?C.PGOLD:i%2===0?C.LTYEL:C.LTGLD);
        });
        // Fading cross at top
        p(15,2,C.PGOLD);p(14,3,C.LTGLD);p(16,3,C.LTGLD);p(15,4,C.LTGLD);
        // Halo remnant
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(15+Math.round(Math.cos(a)*3),6+Math.round(Math.sin(a)*2),i%2?C.PGOLD:C.LTYEL);}
      } else if(frame.opts.custom==='portrait'){
        // Portrait — front-facing armored paladin bust
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Background
        b(2,2,28,60,C.DKSHADOW);b(3,3,26,58,C.SHADOW);
        // Helmet
        b(8,6,16,8,C.ARMOR);b(9,7,14,6,C.LTARMOR);
        b(9,5,14,2,C.GOLD);b(10,4,12,2,C.LTGLD);b(12,3,8,1,C.WHITE);
        // Crest
        p(15,2,C.WHITE);p(16,2,C.WHITE);p(15,1,C.PGOLD);
        // Visor
        b(10,11,12,3,C.DKBRN);b(11,11,10,2,C.DKSHADOW);
        // Eyes through visor
        b(11,12,3,2,C.PGOLD);p(12,12,C.WHITE);
        b(18,12,3,2,C.PGOLD);p(19,12,C.WHITE);
        // Cheek guards
        p(8,11,C.DKARMOR);p(7,12,C.DEEPARMOR);p(24,11,C.DKARMOR);p(25,12,C.DEEPARMOR);
        // Halo
        for(let i=0;i<10;i++){const a=i*Math.PI/5;p(16+Math.round(Math.cos(a)*10),6+Math.round(Math.sin(a)*4),i%2?C.GOLD:C.PGOLD);}
        // Gorget
        b(8,15,16,3,C.GOLD);b(9,15,14,2,C.LTGLD);
        // Shoulder armor
        b(4,18,6,6,C.ARMOR);b(5,18,4,5,C.LTARMOR);p(5,18,C.GOLD);
        b(22,18,6,6,C.ARMOR);b(23,18,4,5,C.LTARMOR);p(26,18,C.GOLD);
        // Chest plate
        b(8,18,16,18,C.ARMOR);b(9,18,14,16,C.LTARMOR);
        // Cross emblem on chest
        p(16,21,C.WHITE);p(15,22,C.GOLD);p(16,22,C.WHITE);p(17,22,C.GOLD);
        p(16,23,C.GOLD);p(16,24,C.DKGLD);p(16,25,C.DEEPGLD);
        // Cape edges
        b(3,20,2,16,C.CAPE);b(27,20,2,16,C.CAPE);
        b(3,20,1,16,C.DKCAPE);b(28,20,1,16,C.DKCAPE);
        // Border
        b(2,2,28,1,C.GOLD);b(2,61,28,1,C.GOLD);b(2,2,1,60,C.GOLD);b(29,2,1,60,C.GOLD);
        p(3,3,C.WHITE);p(28,3,C.WHITE);p(3,60,C.WHITE);p(28,60,C.WHITE);
      } else {
        drawChar(ctx,o,frame.dir,frame.opts);
      }
    });
  });
  return{cols,rows,cw:H_CW,ch:H_CH};
}

// ===== DRAWING HELPERS =====
const mk=(c,o[],gw,gh,ps)=>{
  const p=(x,y,cl)=>{if(!cl||x<0||x>=gw||y<0||y>=gh)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,ps,ps);};
  const b=(x,y,w,h,cl)=>{if(!cl)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,w*ps,h*ps);};
  return{p,b};
};

// ===== TOWER HELPERS =====
const T_PX=2,T_G=32,T_CELL=T_G*T_PX;

function tBase(p,b,topY,w,glow){
  const cx=16;
  // Crystalline brain/neural structure base
  for(let i=0;i<10;i++){
    const cw=w-6+Math.floor(i*0.8),sx=cx-Math.floor(cw/2);
    b(sx,topY+i,cw,1,i<2?C.BRPUR:i<5?C.MDPUR:i<8?C.DKPUR:C.DPPUR);
  }
  b(cx-Math.floor((w-6)/2),topY,w-6,1,C.LTPUR);
  // Neural network pattern / third eye
  p(cx,topY+2,glow>1?C.WHITE:C.PINK);p(cx-1,topY+3,glow>1?C.LTPNK:C.PINK);
  p(cx+1,topY+3,glow>1?C.LTPNK:C.PINK);p(cx,topY+4,glow>0?C.PINK:C.DKPNK);
  // Neural veins on base
  p(cx-3,topY+4,C.MIND3);p(cx+3,topY+4,C.MIND3);
  p(cx-4,topY+6,glow>0?C.MIND2:C.MIND3);p(cx+4,topY+6,glow>0?C.MIND2:C.MIND3);
  // Purple energy veins pulsing
  p(cx-2,topY+5,glow>1?C.PLPUR:C.BRPUR);p(cx+2,topY+5,glow>1?C.PLPUR:C.BRPUR);
  b(cx-Math.floor((w-2)/2),topY+9,w-2,1,C.DKPSY);
  if(glow>0){p(cx-5,topY+3,C.DPNK);p(cx+5,topY+3,C.DPNK);}
}

function tTendril(p,x1,y1,x2,y2,col,bright){
  const dy=y2-y1,dx=x2-x1;
  for(let i=0;i<=Math.abs(dy);i++){
    const t=i/Math.max(1,Math.abs(dy));
    const yy=y1+Math.round(i*Math.sign(dy));
    const xx=Math.round(x1+dx*t+Math.sin(t*Math.PI*2)*1.5);
    p(xx,yy,bright&&i%2===0?C.PLPUR:col);
  }
}

function tNeuralVein(p,x1,y1,x2,y2,col,bright){
  const dy=y2-y1,dx=x2-x1,steps=Math.max(Math.abs(dx),Math.abs(dy));
  for(let i=0;i<=steps;i++){
    const t=i/Math.max(1,steps);
    const xx=Math.round(x1+dx*t+Math.sin(t*Math.PI*3)*1.2);
    const yy=Math.round(y1+dy*t+Math.cos(t*Math.PI*2)*0.8);
    p(xx,yy,bright&&i%3===0?C.PLPUR:col);
  }
}

function tSpire(p,b,x,y,h,w,c1,c2,ct){
  for(let i=0;i<h;i++){
    const pr=i/h,cw=Math.max(1,Math.round(w*(1-pr*0.85)));
    b(x+Math.floor((w-cw)/2),y+h-1-i,cw,1,pr<0.15?ct:pr<0.5?c2:c1);
  }
}

}

          b(sx,cy-5+i,w,1,i<2?C.WHITE:i<4?C.PLPUR:i<7?C.LTPUR:C.BRPUR);
        }
        // Crystal facets
        p(cx-2,cy-1,C.MIND2);p(cx+2,cy+1,C.MIND2);
        // Tip glow
        p(cx,cy-5,C.WHLAV);
      }
      else if(f===3){
        // Psychic shatter - crystal explosion
        for(let i=0;i<10;i++){const a=i*Math.PI/5,r=5;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%2?C.LTPUR:C.PLPUR);
        }
        // Crystal fragments
        p(cx-2,cy-3,C.WHLAV);p(cx+3,cy-1,C.LTPUR);p(cx-1,cy+3,C.BRPUR);p(cx+2,cy+2,C.PLPUR);
        p(cx,cy,C.WHITE);b(cx-1,cy-1,2,2,C.LTPUR);
      }
      else if(f===4){
        // Shatter dissipate - fragments flying
        for(let i=0;i<12;i++){const a=i*Math.PI/6,r=3+i%3;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%3===0?C.PLPUR:C.MIND3);}
        p(cx-1,cy,C.BRPUR);p(cx+1,cy,C.BRPUR);
      }
      else{
        [[4,4],[11,5],[6,12],[9,3],[3,8],[13,9]].forEach(([x,y],i)=>p(x,y,i%2?C.MIND3:C.DKPUR));
      }
    },
    // Overmind: massive neural pulse → mind blast nova
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Neural pulse expanding
        const r=[3,4,5][f];
        for(let i=0;i<12;i++){const a=i*Math.PI/6;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%3===0?C.WHITE:i%2?C.PLPUR:C.LTPUR);
        }
        // Inner brain pattern
        b(cx-1,cy-1,2,2,C.MIND2);p(cx,cy,f>1?C.WHITE:C.PLPUR);
        // Neural tendrils
        if(f>0){for(let i=0;i<4;i++){const a=i*Math.PI/2;
          p(cx+Math.round(Math.cos(a)*2),cy+Math.round(Math.sin(a)*2),C.BRPUR);
        }}
      }
      else if(f===3){
        // Mind blast nova - concentric rings
        for(let r=2;r<=6;r+=2)for(let i=0;i<12;i++){
          const a=i*Math.PI/6;
          const px=cx+Math.round(Math.cos(a)*r),py=cy+Math.round(Math.sin(a)*r);
          if(px>=0&&px<16&&py>=0&&py<16) p(px,py,r<4?C.WHITE:r<6?C.PLPUR:C.LTPUR);
        }
        p(cx,cy,C.WHITE);b(cx-1,cy-1,2,2,C.PAPNK);
        // Confusion sparks
        [[2,2],[13,3],[3,13],[12,12]].forEach(([x,y])=>p(x,y,C.PINK));
      }
      else if(f===4){
        // Nova dissipate - fading rings
        for(let i=0;i<8;i++){const a=i*Math.PI/4;
          p(cx+Math.round(Math.cos(a)*7),cy+Math.round(Math.sin(a)*7),C.MIND3);
          p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),C.BRPUR);
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.MIND2);
        }
        p(cx,cy,C.BRPUR);
      }
      else{
        // Fade out
        [[3,4],[12,3],[5,12],[10,11],[7,2],[9,14],[2,7],[14,8]].forEach(([x,y],i)=>p(x,y,i%3===0?C.MIND3:i%2?C.DKPUR:C.MIND2));
        p(cx,cy,C.MIND3);
      }
    },
  ];
  const cols=5,rows=6;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*P_CELL,row*P_CELL],row);
  return{cols,rows,cell:P_CELL};
}

// ===== HERO: MONK (8×5 at 64×128) =====
const H_PX=2,H_GW=32,H_GH=64,H_CW=H_GW*H_PX,H_CH=H_GH*H_PX;

function drawHero(ctx){
  // dir: 0=down,1=side,2=up | type: idle/walk/atk | frame: variant
  function drawChar(c,o[],dir,opts={}){
    const{p,b}=mk(c,o,H_GW,H_GH,H_PX);
    const{lOff=0,rOff=0,atk=false,atkFrame=0,dash=false,meditate=false,flyKick=false,thousandFists=false,hurt=false,armSwing=0}=opts;
    const cx=16;

    // Dash afterimage
    if(dash){
      for(let y=0;y<22;y++){const w=y<4?3:y<8?5:y<14?4:3,sx=cx-9-Math.floor(w/2);for(let x=0;x<w;x++){const px_=sx+x;if(px_>=0)p(px_,6+y,y%2?C.VOID:C.SHAD);}}
      for(let y=0;y<16;y++){const w=y<3?2:y<10?3:2,sx=cx-16-Math.floor(w/2);for(let x=0;x<w;x++){const px_=sx+x;if(px_>=0)p(px_,9+y,C.VOID);}}
      p(cx-8,10,C.MIND3);p(cx-12,13,C.DPPUR);
    }

    // Thousand fists blur effect
    if(thousandFists){
      // Multiple arm afterimages
      for(let af=0;af<4;af++){
        const ox=cx+3+af*2,oy=8+af*3;
        if(ox<30&&oy<50){p(ox,oy,C.PLPUR);p(ox+1,oy,C.LTPUR);p(ox,oy+1,C.BRPUR);}
        const ox2=cx-3-af*2,oy2=10+af*2;
        if(ox2>=0&&oy2<50){p(ox2,oy2,C.PLPUR);p(ox2-1,oy2,C.LTPUR);p(ox2,oy2+1,C.BRPUR);}
      }
      // Energy burst particles
      [[3,5],[26,8],[5,15],[27,12],[2,20],[29,18]].forEach(([mx,my])=>{
        p(mx,my,C.PINK);p(mx+1,my,C.LTPNK);
      });
    }

    // Meditation glow
    if(meditate){
      // Aura rings
      for(let i=0;i<16;i++){const a=i*Math.PI/8,r=10;
        const px_=cx+Math.round(Math.cos(a)*r),py_=30+Math.round(Math.sin(a)*r);
        if(px_>=0&&px_<32&&py_>=0&&py_<64)p(px_,py_,i%2?C.PLPUR:C.LTPUR);
      }
      for(let i=0;i<12;i++){const a=i*Math.PI/6,r=14;
        const px_=cx+Math.round(Math.cos(a)*r),py_=30+Math.round(Math.sin(a)*r);
        if(px_>=0&&px_<32&&py_>=0&&py_<64)p(px_,py_,i%3===0?C.WHLAV:C.BRPUR);
      }
      // Third eye glow
      p(cx,5,C.PINK);p(cx-1,4,C.LTPNK);p(cx+1,4,C.LTPNK);p(cx,3,C.WHITE);
    }

    const lean=dash?2:flyKick?3:atk&&atkFrame>0?1:0;
    const headY=dash?5:meditate?10:7;
    const torY=headY+7;
    const legY=torY+9;
    const bx_=cx+lean;

    // ROBES (behind body)
    if(dir===2||dir===0){
      const cY=torY+4,sp=dash?3:meditate?0:flyKick?4:1;
      for(let i=0;i<14;i++){
        const w=5+Math.floor(i*0.4)+sp,sx_=bx_-Math.floor(w/2)+Math.round(Math.sin(i*0.3+(dash?2:0))*0.8);
        const cl=i<3?C.DKROBE:i<8?C.ROBE:i<11?C.DKROBE:C.DKGRAY;
        for(let x=0;x<w;x++){const px_=sx_+x;if(px_>=0&&px_<32&&cY+i<62)p(px_,cY+i,cl);}
      }
      // Robe edge detail
      for(let i=0;i<10;i++){
        const w=5+Math.floor(i*0.4)+sp,sx_=bx_-Math.floor(w/2)+Math.round(Math.sin(i*0.3+(dash?2:0))*0.8);
        if(cY+i<62){p(sx_,cY+i,C.ROBE);if(sx_+w-1<32)p(sx_+w-1,cY+i,i%3===0?C.LTROBE:C.ROBE);}
      }
      // Bottom tatter
      const bY_=Math.min(cY+12,61);
      for(let x=-4;x<5;x++){const px_=bx_+x;if(px_>=0&&px_<32&&(px_+bY_)%3!==0)p(px_,bY_,C.DKGRAY);if(px_>=0&&px_<32&&(px_+bY_)%2===0&&bY_+1<63)p(px_,bY_+1,C.SHAD);}
    }

    // HEAD — Bald monk with third eye mark
    if(dir===0){
      // Down facing - bald head
      b(bx_-4,headY,8,6,C.SKIN);b(bx_-3,headY-1,6,1,C.SKIN);b(bx_-2,headY-2,4,1,C.SKIN);
      // Scalp highlight
      b(bx_-2,headY-1,4,1,C.LTSKIN);p(bx_-1,headY-2,C.LTSKIN);
      // Face shadow
      b(bx_-3,headY+4,6,2,C.DKSKIN);
      // Eyes
      p(bx_-2,headY+2,C.DKPSY);p(bx_+2,headY+2,C.DKPSY);
      // Third eye mark
      p(bx_,headY,C.PINK);p(bx_-1,headY+1,C.DKPNK);p(bx_+1,headY+1,C.DKPNK);
      if(meditate||thousandFists){p(bx_,headY,C.WHITE);p(bx_-1,headY,C.LTPNK);p(bx_+1,headY,C.LTPNK);}
      // Mouth
      p(bx_,headY+4,C.DKSKIN);
      // Ears
      p(bx_-4,headY+2,C.DKSKIN);p(bx_+4,headY+2,C.DKSKIN);
    } else if(dir===1){
      // Side profile
      b(bx_-3,headY,6,6,C.SKIN);b(bx_-2,headY-1,5,1,C.SKIN);b(bx_-1,headY-2,3,1,C.SKIN);
      // Profile highlight
      b(bx_-1,headY-1,3,1,C.LTSKIN);
      // Face shadow
      b(bx_-2,headY+4,4,2,C.DKSKIN);
      // Eye
      p(bx_+1,headY+2,C.DKPSY);p(bx_+2,headY+2,C.DKPSY);
      // Third eye (side)
      p(bx_,headY,C.PINK);
      if(meditate||thousandFists){p(bx_,headY,C.WHITE);}
      // Nose
      p(bx_+3,headY+3,C.DKSKIN);
      // Ear
      p(bx_-3,headY+2,C.DKSKIN);
    } else {
      // Up - back of head
      b(bx_-4,headY,8,6,C.SKIN);b(bx_-3,headY-1,6,1,C.SKIN);b(bx_-2,headY-2,4,1,C.SKIN);
      b(bx_-3,headY,6,5,C.DKSKIN);
      // Scalp top
      b(bx_-2,headY-1,4,1,C.LTSKIN);p(bx_-1,headY-2,C.LTSKIN);
      // Neck
      b(bx_-2,headY+5,4,1,C.DKSKIN);
    }

    // TORSO — simple robes
    b(bx_-3,torY,6,8,C.ROBE);b(bx_-2,torY,4,8,C.LTROBE);
    if(dir===0){
      // Robe front fold / sash
      p(bx_,torY+1,C.DKROBE);p(bx_,torY+2,C.DKROBE);p(bx_,torY+3,C.DKROBE);
      p(bx_,torY+4,C.DKROBE);p(bx_,torY+5,C.DKROBE);
      // Purple sash
      b(bx_-3,torY+6,6,2,C.MIND2);b(bx_-2,torY+6,4,1,C.BRPUR);p(bx_,torY+6,C.LTPUR);
    } else if(dir===1){
      p(bx_+1,torY+1,C.DKROBE);p(bx_+1,torY+3,C.DKROBE);p(bx_+1,torY+5,C.DKROBE);
      b(bx_-2,torY+6,4,2,C.MIND2);b(bx_-1,torY+6,2,1,C.BRPUR);
    } else {
      p(bx_-1,torY+1,C.DKROBE);p(bx_,torY+2,C.DKROBE);p(bx_+1,torY+1,C.DKROBE);
      b(bx_-3,torY+6,6,2,C.MIND2);b(bx_-2,torY+6,4,1,C.BRPUR);
    }

    // ARMS & PSYCHIC ENERGY HANDS
    if(atk){
      // Palm strike attacks with psychic energy bursts
      if(dir===0){
        if(atkFrame===0){
          // Wind up - arm pulled back
          b(bx_+3,torY-1,2,4,C.SKIN);b(bx_+3,torY-1,2,2,C.ROBE);
          // Psychic energy charging
          p(bx_+5,torY-2,C.PLPUR);p(bx_+6,torY-3,C.LTPUR);p(bx_+5,torY-4,C.WHITE);
          b(bx_-5,torY+2,2,4,C.ROBE);p(bx_-5,torY+5,C.SKIN);
        } else {
          // Palm strike forward - energy burst
          b(bx_+3,torY+2,3,2,C.SKIN);b(bx_+3,torY+1,2,2,C.ROBE);
          // Psychic energy palm burst
          for(let i=0;i<6;i++) p(bx_+6,torY+i-1,i===0?C.WHITE:i<3?C.PLPUR:C.LTPUR);
          for(let i=0;i<4;i++) p(bx_+7,torY+i,i<2?C.PLPUR:C.BRPUR);
          p(bx_+8,torY+1,C.WHLAV);p(bx_+8,torY+2,C.PLPUR);
          b(bx_-5,torY+2,2,4,C.ROBE);p(bx_-5,torY+5,C.SKIN);
        }
      } else if(dir===1){
        if(atkFrame===0){
          b(bx_+3,torY,3,2,C.ROBE);b(bx_+4,torY+2,2,2,C.SKIN);
          p(bx_+6,torY-1,C.PLPUR);p(bx_+7,torY-2,C.LTPUR);p(bx_+6,torY-3,C.WHITE);
        } else {
          b(bx_+3,torY+1,3,2,C.ROBE);b(bx_+5,torY+3,2,2,C.SKIN);
          for(let i=0;i<5;i++){const x_=bx_+7+Math.floor(i*0.3),y_=torY+2+i;if(x_<32&&y_<63)p(x_,y_,i===0?C.WHITE:i<3?C.PLPUR:C.LTPUR);}
          p(bx_+8,torY+3,C.WHLAV);
        }
      } else {
        if(atkFrame===0){b(bx_+3,torY-1,2,3,C.ROBE);p(bx_+4,torY-2,C.SKIN);p(bx_+5,torY-3,C.PLPUR);p(bx_+5,torY-4,C.WHITE);}
        else{b(bx_+3,torY+3,2,3,C.ROBE);p(bx_+4,torY+5,C.SKIN);for(let i=0;i<5;i++)p(bx_+5,torY+6+i,i<2?C.PLPUR:C.BRPUR);}
      }
    } else {
      // Idle/walk arms
      const aY=torY+1;
      if(dir===0){
        b(bx_-5,aY+armSwing,2,5,C.ROBE);p(bx_-5,aY+armSwing+4,C.SKIN);p(bx_-4,aY+armSwing+4,C.SKIN);
        b(bx_+3,aY-armSwing,2,5,C.ROBE);p(bx_+3,aY-armSwing+4,C.SKIN);p(bx_+4,aY-armSwing+4,C.SKIN);
        // Subtle psychic glow on hands
        if(meditate){p(bx_-5,aY+armSwing+5,C.PLPUR);p(bx_+4,aY-armSwing+5,C.PLPUR);}
      } else if(dir===1){
        b(bx_+3,aY-armSwing,2,5,C.ROBE);p(bx_+3,aY-armSwing+4,C.SKIN);p(bx_+4,aY-armSwing+4,C.SKIN);
        if(meditate){p(bx_+4,aY-armSwing+5,C.PLPUR);}
      } else {
        b(bx_-5,aY+armSwing,2,5,C.ROBE);p(bx_-5,aY+armSwing+4,C.SKIN);
        b(bx_+3,aY-armSwing,2,5,C.ROBE);p(bx_+4,aY-armSwing+4,C.SKIN);
      }
    }

    // LEGS
    const lh=10;
    if(flyKick){
      // Flying kick — legs extended
      b(bx_+2,legY-2,2,3,C.ROBE);b(bx_+4,legY-3,2,2,C.SKIN);
      b(bx_+6,legY-4,3,2,C.SKIN);p(bx_+8,legY-4,C.DKSKIN);// Extended foot
      b(bx_-3,legY,2,4,C.ROBE);p(bx_-3,legY+3,C.SKIN);// Trailing leg
      // Psychic energy trail on kick
      p(bx_+9,legY-5,C.PLPUR);p(bx_+10,legY-4,C.LTPUR);p(bx_+9,legY-3,C.BRPUR);
    } else if(meditate){
      // Cross-legged sitting
      b(bx_-4,legY,8,3,C.ROBE);b(bx_-3,legY+1,6,2,C.DKROBE);
      p(bx_-4,legY+2,C.SKIN);p(bx_+4,legY+2,C.SKIN);// Feet visible
      // Levitation gap
      p(bx_-2,legY+4,C.SHAD);p(bx_+2,legY+4,C.SHAD);
    } else {
      b(bx_-2+lOff,legY,2,lh,C.ROBE);p(bx_-1+lOff,legY,C.LTROBE);
      b(bx_+1+rOff,legY,2,lh,C.ROBE);p(bx_+2+rOff,legY,C.LTROBE);
      // Feet/sandals
      const lfy=Math.min(legY+lh,61),rfy=Math.min(legY+lh,61);
      b(bx_-3+lOff,lfy,4,2,C.DKSKIN);b(bx_-3+lOff,lfy,3,1,C.SKIN);
      b(bx_+rOff,rfy,4,2,C.DKSKIN);b(bx_+1+rOff,rfy,3,1,C.SKIN);
      // Ground shadow
      if(!dash&&lfy+2<63){p(bx_-3+lOff,lfy+2,C.SHAD);p(bx_+3+rOff,rfy+2,C.SHAD);}
    }

    // Hurt flash
    if(hurt){p(bx_+4,headY+1,C.PINK);p(bx_+5,headY,C.LTPNK);p(bx_+6,headY+1,C.PINK);p(bx_+5,headY+2,C.LTPNK);}

    // Flying kick energy trail
    if(flyKick){
      for(let y=headY-2;y<legY+4;y+=3){p(bx_-7,y,C.BRPUR);p(bx_-8,y+1,C.MIND3);}
    }

    // Dash energy trail
    if(dash){
      for(let y=headY-2;y<legY+8;y+=3){p(bx_-7,y,C.MIND3);p(bx_+7,y+1,C.MIND3);}
    }
  }

  // Layout: 8 cols × 5 rows at 64×128
  // R0: Down  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R1: Side  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R2: Up    idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R3: Abilities palmStrike1,palmStrike2,innerFocus1,innerFocus2,flyingKick1,flyingKick2,thousandFists1,thousandFists2
  // R4: hurt,death1,death2,portrait,x,x,x,x

  const frames[]=[];
  // Per-direction rows
  for(let dir=0;dir<3;dir++){
    frames.push([
      {dir,opts:{}},
      {dir,opts:{armSwing:1}},
      {dir,opts:{lOff:1,rOff:-1,armSwing:1}},
      {dir,opts:{lOff:-1,rOff:1,armSwing:-1}},
      {dir,opts:{lOff:2,rOff:0,armSwing:1}},
      {dir,opts:{lOff:0,rOff:2,armSwing:-1}},
      {dir,opts:{atk:true,atkFrame:0,lOff:1}},
      {dir,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},
    ]);
  }
  // Abilities
  frames.push([
    {dir:0,opts:{atk:true,atkFrame:0,lOff:1}},           // Palm strike wind-up
    {dir:0,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},   // Palm strike hit
    {dir:0,opts:{meditate:true}},                          // Inner focus 1
    {dir:0,opts:{meditate:true,armSwing:1}},               // Inner focus 2
    {dir:1,opts:{dash:true,flyKick:true,lOff:2,rOff:1}},  // Flying kick 1
    {dir:1,opts:{dash:true,flyKick:true,lOff:3,rOff:2}},  // Flying kick 2
    {dir:0,opts:{thousandFists:true,atk:true,atkFrame:0}}, // Thousand fists 1
    {dir:0,opts:{thousandFists:true,atk:true,atkFrame:1,armSwing:1}}, // Thousand fists 2
  ]);
  // States
  frames.push([
    {dir:0,opts:{hurt:true,lOff:-1,rOff:-1}},
    {dir:0,opts:{custom:'death1'}},
    {dir:0,opts:{custom:'death2'}},
    {dir:0,opts:{custom:'portrait'}},
    null,null,null,null,
  ]);

  const cols=8,rows=5;
  frames.forEach((row,ry)=>{
    row.forEach((frame,rx)=>{
      if(!frame)return;
      const o=[rx*H_CW,ry*H_CH];
      if(frame.opts.custom==='death1'){
        // Monk collapsed, spirit beginning to ascend
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Body on ground
        b(6,34,18,4,C.ROBE);b(7,35,16,2,C.DKROBE);b(6,34,18,1,C.LTROBE);
        // Head
        b(5,32,5,3,C.SKIN);b(5,32,5,1,C.LTSKIN);p(7,33,C.DKPSY);// Eye closed
        // Third eye still glowing
        p(6,31,C.PINK);p(7,31,C.LTPNK);
        // Arm
        b(23,34,4,2,C.SKIN);b(22,36,3,1,C.DKSKIN);
        // Legs
        b(8,38,14,3,C.ROBE);b(7,39,16,2,C.DKROBE);
        // Sash on ground
        b(12,37,6,1,C.MIND2);p(14,37,C.BRPUR);
        // Spirit ascending
        for(let y=20;y<30;y++){
          const w=y<24?2:1;const sx_=14-Math.floor(w/2)+Math.round(Math.sin(y*0.4)*1);
          for(let x=0;x<w;x++){const px_=sx_+x;if(px_>=0&&px_<32)p(px_,y,y%2?C.PLPUR:C.LTPUR);}
        }
        p(14,19,C.WHITE);p(13,20,C.PLPUR);p(15,20,C.PLPUR);
        // Ground shadow
        for(let x=5;x<25;x++){if(x%3!==0)p(x,41,C.SHAD);if(x%4===0)p(x,42,C.VOID);}
      } else if(frame.opts.custom==='death2'){
        // Spirit fully ascended, body faded

// ===== DRAWING HELPERS =====
const mk=(c,o[],gw,gh,ps)=>{
  const p=(x,y,cl)=>{if(!cl||x<0||x>=gw||y<0||y>=gh)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,ps,ps);};
  const b=(x,y,w,h,cl)=>{if(!cl)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,w*ps,h*ps);};
  return{p,b};
};

// ===== TOWER HELPERS =====
const T_PX=2,T_G=32,T_CELL=T_G*T_PX;

// Resonating base with tuning fork prongs and sound wave rings
function tBase(p,b,topY,w,glow,tint?){
  const cx=16;
  // Platform
  for(let i=0;i<8;i++){
    const cw=w-4+Math.floor(i*0.6),sx=cx-Math.floor(cw/2);
    b(sx,topY+i,cw,1,i<2?C.GOLD:i<4?C.DKGLD:i<6?C.DPGLD:C.DKAMB);
  }
  b(cx-Math.floor((w-4)/2),topY,w-4,1,C.LTGLD);
  // Tuning fork prongs
  const fh=4;
  b(cx-3,topY-fh,1,fh,glow>1?C.LTGLD:C.GOLD);
  b(cx+2,topY-fh,1,fh,glow>1?C.LTGLD:C.GOLD);
  b(cx-2,topY-1,4,1,C.DKGLD);// crossbar
  // Resonance rings on base
  if(glow>0){
    const rc=tint||C.GOLD;
    p(cx-5,topY+2,rc);p(cx+4,topY+2,rc);
    p(cx-6,topY+3,rc);p(cx+5,topY+3,rc);
  }
  if(glow>1){
    const rc=tint||C.LTGLD;
    p(cx-7,topY+1,rc);p(cx+6,topY+1,rc);
    p(cx-8,topY+3,rc);p(cx+7,topY+3,rc);
  }
  // Base bottom edge
  b(cx-Math.floor((w-2)/2),topY+7,w-2,1,C.DKAMB);
}

// Draw a crystal spire
function tCrystal(p,b,x,y,h,w,c1,c2,ct){
  for(let i=0;i<h;i++){
    const pr=i/h,cw=Math.max(1,Math.round(w*(1-pr*0.8)));
    b(x+Math.floor((w-cw)/2),y+h-1-i,cw,1,pr<0.15?ct:pr<0.5?c2:c1);
  }
}

// Draw concentric rings (aura emanation)
function tRings(p,cx,cy,r,col,col2,count){
  for(let ring=0;ring<count;ring++){
    const rad=r+ring*3;
    for(let i=0;i<rad*4;i++){
      const a=i*Math.PI*2/(rad*4);
      const px=cx+Math.round(Math.cos(a)*rad);
      const py=cy+Math.round(Math.sin(a)*(rad*0.6));
      if(i%2===0)p(px,py,ring%2===0?col:col2);
    }
  }
}

// Draw connecting beam lines
function tBeam(p,x1,y1,x2,y2,col,bright){
  const dx=x2-x1,dy=y2-y1;
  const steps=Math.max(Math.abs(dx),Math.abs(dy));
  for(let i=0;i<=steps;i++){
    const t=i/Math.max(1,steps);
    const xx=Math.round(x1+dx*t);
    const yy=Math.round(y1+dy*t);
    p(xx,yy,i%2===0?bright:col);
  }
}

      const br=s>=1,fl=s===2;

      tCrystal(p,b,14,2,19,4,C.DKBLU,br?C.LTBLU:C.BLUE,fl?C.WHITE:C.LTBLU);
