<!DOCTYPE html>
<html>
<head><title>Sprite Sheet Renderer</title>
<style>
  body { background: #111; color: #fff; font-family: monospace; }
  .faction { margin: 20px; padding: 10px; border: 1px solid #333; }
  canvas { border: 1px solid #444; margin: 5px; }
  h2 { color: #ff8; }
  button { margin: 5px; padding: 8px 16px; cursor: pointer; background: #333; color: #fff; border: 1px solid #666; }
  button:hover { background: #555; }
</style>
</head>
<body>
<h1>Factions — Sprite Sheet Renderer</h1>
<p>Click "Save PNGs" for each faction to download the spritesheets.</p>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>

// ===== VOID =====

// ===== PALETTE =====
const C={
  VOID:'#08000f',SHAD:'#0f0019',DKPUR:'#1a0033',DEPUR:'#2a1155',
  MDPUR:'#442288',BRPUR:'#6644cc',LTPUR:'#8866ee',PLPUR:'#aa99dd',
  PINK:'#ff4488',LTPNK:'#ff77bb',PAPNK:'#ffaadd',CRIM:'#cc2255',DKPNK:'#881144',DPNK:'#55112a',
  CYAN:'#00ffcc',DKCYN:'#009977',LTCYN:'#66ffe6',PLCYN:'#aaffee',
  GOLD:'#ffcc00',DKGLD:'#aa8800',LTGLD:'#ffee88',
  WHITE:'#ffffff',GRAY:'#554466',DKGRAY:'#2a1a3a',
};

// ===== DRAWING HELPERS =====
const mk=(c,o,gw,gh,ps)=>{
  const p=(x,y,cl)=>{if(!cl||x<0||x>=gw||y<0||y>=gh)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,ps,ps);};
  const b=(x,y,w,h,cl)=>{if(!cl)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,w*ps,h*ps);};
  return{p,b};
};

// ===== TOWER HELPERS =====
const T_PX=2,T_G=32,T_CELL=T_G*T_PX;

function tBase(p,b,topY,w,glow){
  const cx=16;
  for(let i=0;i<10;i++){
    const cw=w-6+Math.floor(i*0.8),sx=cx-Math.floor(cw/2);
    b(sx,topY+i,cw,1,i<2?C.MDPUR:i<5?C.DEPUR:i<8?C.DKPUR:C.SHAD);
  }
  b(cx-Math.floor((w-6)/2),topY,w-6,1,C.BRPUR);
  p(cx-3,topY+3,glow>1?C.LTPNK:C.PINK);p(cx-2,topY+4,glow>1?C.LTPNK:C.PINK);
  p(cx-2,topY+5,glow>0?C.PINK:C.CRIM);p(cx-3,topY+6,C.DKPNK);
  b(cx-Math.floor((w-2)/2),topY+9,w-2,1,C.VOID);
  if(glow>0){p(cx-4,topY+2,C.DKPNK);p(cx+2,topY+3,C.DKPNK);}
}

function tTendril(p,x1,y1,x2,y2,col,bright){
  const dy=y2-y1,dx=x2-x1;
  for(let i=0;i<=Math.abs(dy);i++){
    const t=i/Math.max(1,Math.abs(dy));
    const yy=y1+Math.round(i*Math.sign(dy));
    const xx=Math.round(x1+dx*t+Math.sin(t*Math.PI*2)*1.5);
    p(xx,yy,bright&&i%2===0?C.LTPNK:col);
  }
}

function tSpire(p,b,x,y,h,w,c1,c2,ct){
  for(let i=0;i<h;i++){
    const pr=i/h,cw=Math.max(1,Math.round(w*(1-pr*0.85)));
    b(x+Math.floor((w-cw)/2),y+h-1-i,cw,1,pr<0.15?ct:pr<0.5?c2:c1);
  }
}

// ===== TOWERS (5×4 at 64×64) =====
function drawTowers(ctx){
  const fns=[
    // Gambler
    (c,o,s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      tBase(p,b,22,20,s===1?1:s===2?2:0);
      const fy=s===1?3:s===2?2:4,dx=12;
      for(let i=0;i<8;i++){const hw=i<4?i+1:8-i;b(dx+4-hw,fy+i,hw*2,1,s===2?C.LTPNK:C.CRIM);}
      for(let i=1;i<7;i++){const hw=i<4?i:7-i;b(dx+4-hw+1,fy+i,Math.max(1,hw*2-2),1,s===2?C.PAPNK:C.PINK);}
      p(15,fy+3,C.WHITE);p(17,fy+5,C.WHITE);p(16,fy+4,s>=1?C.LTGLD:C.GOLD);
      p(15,fy+4,C.WHITE);p(16,fy+3,C.WHITE);
      tTendril(p,14,fy+8,13,22,s===2?C.LTPNK:C.PINK,s===2);
      tTendril(p,18,fy+8,19,22,s>=1?C.PINK:C.DKPNK,s===2);
      const sp=[[8,3,C.GOLD],[23,5,C.GOLD],[6,8,C.LTGLD],[25,2,C.WHITE]];
      if(s>=1)sp.push([10,1,C.LTGLD],[22,7,C.GOLD],[4,6,C.WHITE],[27,4,C.LTGLD]);
      if(s===2){sp.push([5,1,C.WHITE],[26,1,C.WHITE]);b(12,fy-1,8,1,C.WHITE);b(14,fy-2,4,1,C.LTGLD);}
      sp.forEach(([x,y,cl])=>p(x,y,cl));
      p(11,24,s>=1?C.LTGLD:C.GOLD);p(20,24,s>=1?C.LTGLD:C.GOLD);
      if(s===3){p(14,fy+2,C.DKPNK);p(18,fy+6,C.DKPNK);}
    },
    // Spike
    (c,o,s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      tBase(p,b,23,22,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      tSpire(p,b,14,2,20,4,C.DKCYN,fl?C.LTCYN:C.CYAN,fl?C.WHITE:C.LTCYN);
      tSpire(p,b,8,7,15,3,C.DKPNK,br?C.LTPNK:C.PINK,br?C.PAPNK:C.LTPNK);
      tSpire(p,b,20,5,17,3,C.DEPUR,br?C.LTPUR:C.BRPUR,br?C.PLPUR:C.LTPUR);
      tSpire(p,b,5,12,10,2,C.MDPUR,C.BRPUR,C.LTPUR);
      tSpire(p,b,24,9,13,2,C.DKCYN,fl?C.LTCYN:C.CYAN,fl?C.WHITE:C.LTCYN);
      if(s>=1){p(12,5,C.WHITE);p(13,4,C.LTCYN);p(18,4,C.LTPNK);p(19,5,C.PINK);}
      if(fl){b(14,0,4,2,C.WHITE);b(13,1,6,1,C.LTCYN);for(let i=0;i<5;i++){p(5-i,8+i,C.CYAN);p(27+i,6+i,C.CYAN);}}
      p(9,21,br?C.LTCYN:C.CYAN);p(22,21,br?C.LTPNK:C.PINK);
      [[4,9,C.BRPUR],[27,7,C.CYAN],[3,15,C.DKCYN],[28,12,C.PINK]].forEach(([x,y,cl])=>p(x,y,cl));
      if(s===3){p(15,3,C.DKCYN);p(9,8,C.DKPNK);}
    },
    // Siphon
    (c,o,s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      tBase(p,b,23,20,s===1?1:s===2?2:0);const br=s>=1;
      for(let i=0;i<8;i++){const cw=Math.max(2,Math.round(14-i*1.5));b(16-Math.floor(cw/2),4+i,cw,1,i<2?br?C.LTPUR:C.BRPUR:i<5?C.MDPUR:C.DEPUR);}
      b(9,4,14,1,br?C.PLPUR:C.LTPUR);b(10,3,12,1,C.BRPUR);b(15,12,2,6,C.DEPUR);b(15,12,1,6,C.MDPUR);
      const gc=br?C.LTGLD:C.GOLD,gc2=br?C.GOLD:C.DKGLD;
      const st=s===2?[[5,4],[6,5],[7,6],[8,7],[9,8],[10,9],[11,10],[26,3],[25,4],[24,5],[23,6],[22,7],[21,8],[20,9]]:
        [[6,5],[7,6],[8,7],[9,8],[10,9],[25,4],[24,5],[23,6],[22,7],[21,8],[20,9]];
      st.forEach(([x,y],i)=>p(x,y,i%2===0?gc:gc2));
      if(s>=1)[[3,3,C.GOLD],[28,2,C.GOLD],[2,7,C.LTGLD],[29,6,C.LTGLD]].forEach(([x,y,cl])=>p(x,y,cl));
      if(s===2){[[1,5,C.LTGLD],[30,4,C.LTGLD]].forEach(([x,y,cl])=>p(x,y,cl));b(14,3,4,1,C.WHITE);}
      p(15,18,s===2?C.LTGLD:C.GOLD);p(16,19,C.DKGLD);p(15,20,s===2?C.LTGLD:C.GOLD);
      b(12,25,8,1,s>=1?C.GOLD:C.DKGLD);b(13,24,6,1,s>=1?C.LTGLD:C.GOLD);b(14,24,4,1,s===2?C.WHITE:C.LTGLD);
      tTendril(p,14,12,12,23,C.DKPNK,s===2);tTendril(p,18,12,20,23,C.DKPNK,s===2);
    },
    // Rift
    (c,o,s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      const br=s>=1,fl=s===2;
      b(5,6,3,24,C.DKPUR);b(6,6,1,24,C.DEPUR);b(5,6,3,1,C.MDPUR);p(5,6,C.BRPUR);p(7,6,C.BRPUR);
      b(24,6,3,24,C.DKPUR);b(25,6,1,24,C.DEPUR);b(24,6,3,1,C.MDPUR);p(24,6,C.BRPUR);p(26,6,C.BRPUR);
      b(4,29,24,2,C.SHAD);b(5,29,22,1,C.DKPUR);
      const rw=fl?5:br?4:3;
      for(let y=5;y<26;y++){const w=rw+Math.floor(Math.sin((y-5)*0.3)*2);b(16-Math.floor(w/2),y,w,1,C.VOID);}
      for(let y=4;y<26;y++){const x=14+Math.round(Math.sin(y*0.4)*1.5);p(x,y,fl?C.LTCYN:C.CYAN);p(x-1,y,fl?C.CYAN:C.DKCYN);p(x+1,y,fl?C.CYAN:C.DKCYN);}
      for(let y=6;y<25;y+=2)p(15+(y%3===0?1:0),y,fl?C.PLCYN:C.WHITE);
      if(fl){for(let i=0;i<8;i++){const a=i*Math.PI/4;p(16+Math.round(Math.cos(a)*6),15+Math.round(Math.sin(a)*6),C.LTCYN);}b(10,14,12,3,C.DKCYN);}
      const pe=br?C.LTPNK:C.PINK;
      p(6,10,pe);p(6,16,pe);p(6,22,br?C.PINK:C.CRIM);p(25,12,pe);p(25,18,pe);p(25,24,br?C.PINK:C.CRIM);
      p(8,4,C.PINK);p(9,3,C.PINK);p(22,4,C.PINK);p(21,3,C.PINK);
      if(br){p(14,1,C.WHITE);p(15,0,fl?C.PLCYN:C.LTCYN);p(16,1,C.CYAN);}
      p(5,12,pe);p(26,15,pe);
      if(s===3)for(let y=8;y<24;y+=3)p(15,y,C.DKCYN);
    },
    // Oblivion
    (c,o,s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      tBase(p,b,24,18,s===1?1:s===2?2:0);const br=s>=1,fl=s===2;
      for(let y=0;y<12;y++){const hw=y<2?y+3:y>9?12-y:6;b(16-hw,3+y,hw*2,1,C.DKPUR);}
      for(let y=1;y<11;y++){const hw=y<2?y+1:y>8?10-y:4;b(16-hw,3+y,hw*2,1,C.VOID);}
      const ew=fl?14:br?13:12;
      b(16-Math.floor(ew/2),8,ew,3,C.SHAD);b(16-Math.floor(ew/2)+1,8,ew-2,3,fl?C.PINK:C.CRIM);
      const iw=fl?8:6;b(16-Math.floor(iw/2),8,iw,3,fl?C.LTPNK:C.PINK);b(16-Math.floor(iw/2)+1,8,iw-2,3,fl?C.PAPNK:C.LTPNK);
      b(15,9,2,1,C.WHITE);p(15,8,fl?C.WHITE:C.PAPNK);p(16,10,C.PAPNK);
      b(16-Math.floor(ew/2),7,ew,1,br?C.MDPUR:C.DEPUR);b(16-Math.floor(ew/2),11,ew,1,br?C.MDPUR:C.DEPUR);
      for(let y=0;y<12;y++){const hw=y<2?y+3:y>9?12-y:6;p(16-hw,3+y,br?C.BRPUR:C.MDPUR);p(16+hw-1,3+y,br?C.BRPUR:C.MDPUR);}
      if(fl)for(let i=0;i<12;i++){const a=i*Math.PI/6;p(16+Math.round(Math.cos(a)*9),9+Math.round(Math.sin(a)*6),i%2?C.LTPNK:C.PINK);}
      p(8,6,C.SHAD);p(23,7,C.SHAD);p(7,10,C.SHAD);p(24,11,C.SHAD);
      b(14,15,4,3,C.DEPUR);b(15,15,2,3,C.MDPUR);b(13,18,6,2,C.DKPUR);b(14,18,4,1,C.DEPUR);
      tTendril(p,13,20,11,24,C.DKPNK,fl);tTendril(p,19,20,21,24,C.DKPNK,fl);
      const gc=fl?C.LTGLD:br?C.GOLD:C.DKGLD;p(14,15,gc);p(17,16,fl?C.LTGLD:C.GOLD);p(15,21,gc);p(16,22,C.DKGLD);
      if(s===3){b(11,8,10,1,C.DEPUR);b(11,10,10,1,C.DEPUR);}
    },
  ];
  const cols=5,rows=4;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*T_CELL,row*T_CELL],row);
  return{cols,rows,cell:T_CELL};
}

// ===== PROJECTILES (5×6 at 32×32) =====
const P_PX=2,P_G=16,P_CELL=P_G*P_PX;

function drawProjectiles(ctx){
  const fns=[
    // Coin
    (c,o,f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){const w=[6,4,2][f];b(cx-Math.floor(w/2),cy-3,w,6,C.GOLD);if(w>2){b(cx-Math.floor(w/2)+1,cy-2,w-2,4,C.DKGLD);p(cx,cy-1,C.LTGLD);p(cx-1,cy,C.WHITE);}b(cx-Math.floor(w/2),cy-3,w,1,C.LTGLD);p(cx-4,cy-4,C.WHITE);p(cx+3,cy+3,f===1?C.WHITE:C.LTGLD);}
      else if(f===3){for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),i%2?C.GOLD:C.LTGLD);}p(cx,cy,C.WHITE);b(cx-1,cy-1,3,3,C.GOLD);p(cx,cy,C.WHITE);}
      else if(f===4){for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*6),cy+Math.round(Math.sin(a)*6),C.DKGLD);p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.GOLD);}p(cx,cy,C.LTGLD);p(cx+1,cy-1,C.GOLD);p(cx-1,cy+1,C.GOLD);}
      else{[[3,5],[12,3],[5,11],[10,13],[7,2],[8,14],[2,8],[14,7]].forEach(([x,y],i)=>p(x,y,i%2?C.DKGLD:C.GOLD));p(cx,cy,C.DKGLD);}
    },
    // Shard
    (c,o,f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){const ang=[-1,0,1][f];for(let i=0;i<10;i++){const w=i<2?1:i<8?2:1,sx=cx-Math.floor(w/2)+ang*(i<5?0:i<8?1:0);b(sx,cy-5+i,w,1,i<2?C.WHITE:i<4?C.LTCYN:i<7?C.CYAN:C.DKCYN);}p(cx-2,cy-2,C.DKCYN);p(cx+2,cy+2,C.DKCYN);}
      else if(f===3){for(let i=0;i<10;i++){const a=i*Math.PI/5;p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),i%2?C.CYAN:C.LTCYN);}p(cx,cy,C.WHITE);b(cx-1,cy-1,2,2,C.CYAN);}
      else if(f===4){for(let i=0;i<12;i++){const a=i*Math.PI/6,r=3+i%3;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%3===0?C.LTCYN:C.DKCYN);}p(cx-1,cy,C.CYAN);p(cx+1,cy,C.CYAN);}
      else{[[4,4],[11,5],[6,12],[9,3],[3,8],[13,9]].forEach(([x,y],i)=>p(x,y,i%2?C.DKCYN:C.CYAN));}
    },
    // Gold Orb
    (c,o,f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){const r=[3,4,3][f];for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r){const d=Math.sqrt(x*x+y*y);p(cx+x,cy+y,d<1?C.WHITE:d<r*0.5?C.LTGLD:d<r*0.8?C.GOLD:C.DKGLD);}p(cx-r,cy,C.DEPUR);p(cx+r,cy,C.DEPUR);if(f>0){p(cx-4-f,cy+1,C.DKGLD);p(cx-3-f,cy-1,C.GOLD);}}
      else if(f===3){b(cx-2,cy-2,4,4,C.GOLD);b(cx-1,cy-1,2,2,C.LTGLD);for(let i=0;i<6;i++){const a=i*Math.PI/3;p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),C.GOLD);p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),C.LTGLD);}p(cx,cy,C.WHITE);}
      else if(f===4){for(let i=0;i<8;i++){const a=i*Math.PI/4,r2=4+i%2;p(cx+Math.round(Math.cos(a)*r2),cy+Math.round(Math.sin(a)*r2),C.DKGLD);}p(cx,cy,C.GOLD);p(cx-2,cy,C.DEPUR);p(cx+2,cy,C.DEPUR);}
      else{[[5,6],[10,5],[7,11],[3,8],[12,10]].forEach(([x,y],i)=>p(x,y,i%2?C.DKGLD:C.DEPUR));}
    },
    // Portal
    (c,o,f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){const rot=f*2;for(let i=0;i<12;i++){const a=(i+rot)*Math.PI/6;p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),i%2===0?C.CYAN:C.DKCYN);}b(cx-1,cy-1,2,2,C.VOID);p(cx,cy,C.PINK);p(cx-5,cy,f===0?C.DKCYN:C.SHAD);p(cx+5,cy,f===1?C.DKCYN:C.SHAD);}
      else if(f===3){for(let r=5;r>0;r--)for(let i=0;i<6;i++){const a=i*Math.PI/3;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),r>3?C.DKCYN:r>1?C.CYAN:C.WHITE);}p(cx,cy,C.VOID);b(cx-1,cy-1,2,2,C.VOID);}
      else if(f===4){for(let r=3;r>0;r--)for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),r>2?C.SHAD:C.DKCYN);}p(cx,cy,C.VOID);p(cx-1,cy,C.DKCYN);p(cx+1,cy,C.DKCYN);}
      else{p(cx,cy,C.VOID);p(cx-1,cy,C.SHAD);p(cx+1,cy,C.SHAD);p(cx,cy-1,C.SHAD);p(cx,cy+1,C.SHAD);}
    },
    // Void Eye
    (c,o,f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){const bob=[0,-1,1][f];b(cx-3,cy-2+bob,6,4,C.DKPUR);b(cx-2,cy-1+bob,4,2,C.VOID);b(cx-1,cy-1+bob,2,2,C.CRIM);p(cx,cy+bob,C.PINK);p(cx,cy-1+bob,C.LTPNK);p(cx-4,cy+bob,C.SHAD);p(cx-5,cy-1+bob,C.SHAD);p(cx+4,cy-1+bob,C.SHAD);}
      else if(f===3){b(cx-2,cy-1,4,2,C.CRIM);p(cx,cy,C.WHITE);for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),i%2?C.PINK:C.CRIM);p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.DKPNK);}p(cx-1,cy,C.SHAD);p(cx+1,cy,C.SHAD);}
      else if(f===4){for(let i=0;i<8;i++){const a=i*Math.PI/4,r=3;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),C.DKPNK);}b(cx-1,cy-1,2,2,C.SHAD);p(cx,cy,C.CRIM);}
      else{p(cx,cy,C.SHAD);p(cx-1,cy-1,C.DPNK);p(cx+1,cy+1,C.DPNK);p(cx-2,cy,C.DKPUR);p(cx+2,cy,C.DKPUR);}
    },
  ];
  const cols=5,rows=6;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*P_CELL,row*P_CELL],row);
  return{cols,rows,cell:P_CELL};
}

// ===== HERO (8×5 at 64×128) =====
const H_PX=2,H_GW=32,H_GH=64,H_CW=H_GW*H_PX,H_CH=H_GH*H_PX;

function drawHero(ctx){
  // dir: 0=down,1=side,2=up | type: idle/walk/atk | frame: variant
  function drawChar(c,o,dir,opts={}){
    const{p,b}=mk(c,o,H_GW,H_GH,H_PX);
    const{lOff=0,rOff=0,atk=false,atkFrame=0,dash=false,evade=false,exec=false,ult=false,hurt=false,armSwing=0}=opts;
    const cx=16;

    // Dash afterimage
    if(dash){
      for(let y=0;y<22;y++){const w=y<4?3:y<8?5:y<14?4:3,sx=cx-9-Math.floor(w/2);for(let x=0;x<w;x++){const px_=sx+x;if(px_>=0)p(px_,6+y,y%2?C.VOID:C.SHAD);}}
      for(let y=0;y<16;y++){const w=y<3?2:y<10?3:2,sx=cx-16-Math.floor(w/2);for(let x=0;x<w;x++){const px_=sx+x;if(px_>=0)p(px_,9+y,C.VOID);}}
      p(cx-8,10,C.DKPNK);p(cx-12,13,C.DPNK);
    }

    // Ult marks
    if(ult){
      [[3,2],[26,5],[1,18],[29,15],[5,32],[27,30],[2,45],[28,42],[8,1],[24,3],[4,38],[28,36]].forEach(([mx,my])=>{
        p(mx,my,C.PINK);p(mx+1,my+1,C.CRIM);p(mx-1,my+1,C.CRIM);p(mx,my+2,C.PINK);
      });
    }

    const lean=dash?2:evade?-1:atk&&atkFrame>0?1:0;
    const headY=dash?5:evade?8:7;
    const torY=headY+7;
    const legY=torY+9;
    const bx_=cx+lean;

    // CLOAK (behind body for down/side, main visual for up)
    if(dir===2||dir===0){
      const cY=torY+2, sp=dash?3:ult?2:evade?2:1;
      for(let i=0;i<18;i++){
        const w=6+Math.floor(i*0.5)+sp, sx_=bx_-Math.floor(w/2)+Math.round(Math.sin(i*0.3+(dash?2:0))*0.8);
        const cl=i<4?C.DKPUR:i<10?C.DEPUR:i<14?C.DKPUR:C.SHAD;
        for(let x=0;x<w;x++){const px_=sx_+x;if(px_>=0&&px_<32&&cY+i<62)p(px_,cY+i,cl);}
      }
      // edge highlights
      for(let i=0;i<14;i++){
        const w=6+Math.floor(i*0.5)+sp, sx_=bx_-Math.floor(w/2)+Math.round(Math.sin(i*0.3+(dash?2:0))*0.8);
        if(cY+i<62){p(sx_,cY+i,C.MDPUR);if(sx_+w-1<32)p(sx_+w-1,cY+i,i%3===0?C.MDPUR:C.DEPUR);}
      }
      // bottom tatter
      const bY_=Math.min(cY+16,61);
      for(let x=-6;x<7;x++){const px_=bx_+x;if(px_>=0&&px_<32&&(px_+bY_)%3!==0)p(px_,bY_,C.SHAD);if(px_>=0&&px_<32&&(px_+bY_)%2===0&&bY_+1<63)p(px_,bY_+1,C.VOID);}
    }

    // HOOD
    if(dir===0){
      // Down - front of hood
      b(bx_-4,headY,8,2,C.DKPUR);b(bx_-5,headY+2,10,3,C.DKPUR);
      b(bx_-4,headY+1,8,1,C.DEPUR);b(bx_-3,headY-1,6,1,C.DEPUR);b(bx_-2,headY-2,4,1,C.MDPUR);
      p(bx_-1,headY-3,C.MDPUR);p(bx_,headY-3,C.BRPUR);
      // Hood drape
      b(bx_+5,headY+3,2,3,C.DKPUR);p(bx_+6,headY+2,C.DKPUR);p(bx_+7,headY+4,C.SHAD);
      // Inner void
      b(bx_-3,headY+2,6,3,C.VOID);b(bx_-4,headY+3,8,2,C.VOID);
      // Eyes
      const eg=exec||ult;
      p(bx_-2,headY+3,eg?C.LTPNK:C.PINK);p(bx_-1,headY+3,eg?C.WHITE:C.LTPNK);
      p(bx_+1,headY+3,eg?C.LTPNK:C.PINK);p(bx_+2,headY+3,eg?C.WHITE:C.LTPNK);
      p(bx_-2,headY+4,C.DPNK);p(bx_+2,headY+4,C.DPNK);
      b(bx_-4,headY,8,1,C.MDPUR);p(bx_-5,headY+2,C.MDPUR);
    } else if(dir===1){
      // Side - profile hood
      b(bx_-3,headY,6,2,C.DKPUR);b(bx_-4,headY+2,8,3,C.DKPUR);
      b(bx_-3,headY+1,5,1,C.DEPUR);b(bx_-2,headY-1,4,1,C.DEPUR);b(bx_-1,headY-2,3,1,C.MDPUR);
      p(bx_,headY-3,C.BRPUR);
      b(bx_+4,headY+3,2,3,C.DKPUR);p(bx_+5,headY+2,C.DKPUR);
      b(bx_-3,headY+2,5,3,C.VOID);
      // One eye visible
      const eg=exec||ult;
      p(bx_+1,headY+3,eg?C.LTPNK:C.PINK);p(bx_+2,headY+3,eg?C.WHITE:C.LTPNK);
      p(bx_+1,headY+4,C.DPNK);
      b(bx_-3,headY,6,1,C.MDPUR);
    } else {
      // Up - back of hood
      b(bx_-4,headY,8,5,C.DKPUR);b(bx_-3,headY,6,4,C.DEPUR);
      b(bx_-3,headY-1,6,1,C.DEPUR);b(bx_-2,headY-2,4,1,C.MDPUR);
      p(bx_-1,headY-3,C.MDPUR);p(bx_,headY-3,C.BRPUR);
      b(bx_+4,headY+3,2,3,C.DKPUR);p(bx_+5,headY+2,C.DKPUR);
      b(bx_-4,headY,8,1,C.MDPUR);
      // Hood back detail
      p(bx_-1,headY+1,C.MDPUR);p(bx_,headY+2,C.MDPUR);p(bx_+1,headY+1,C.MDPUR);
    }

    // SCARF (only visible from down and side)
    if(dir!==2){
      const sY=torY-1;
      b(bx_-5,sY,3,1,C.PINK);b(bx_-5,sY+1,2,1,C.PINK);p(bx_-6,sY+1,C.LTPNK);
      const trail=dash?7:4;
      for(let i=0;i<trail;i++){const tx=bx_-6-i+(dash?0:0),ty=sY+1+i;if(ty<63&&tx>=0)p(tx,ty,i<trail-1?C.PINK:C.CRIM);if(i>0&&ty<63&&tx+1<32)p(tx+1,ty,C.DKPNK);}
    }

    // TORSO
    b(bx_-3,torY,6,8,C.DKPUR);b(bx_-2,torY,4,8,C.DEPUR);
    if(dir===0){
      // chest wrap
      p(bx_-2,torY+1,C.MDPUR);p(bx_-1,torY+2,C.MDPUR);p(bx_,torY+3,C.MDPUR);p(bx_+1,torY+2,C.MDPUR);p(bx_+2,torY+1,C.MDPUR);
    } else if(dir===1){
      p(bx_,torY+1,C.MDPUR);p(bx_+1,torY+2,C.MDPUR);p(bx_,torY+3,C.MDPUR);
    } else {
      p(bx_-1,torY+1,C.MDPUR);p(bx_,torY+2,C.MDPUR);p(bx_+1,torY+1,C.MDPUR);
    }
    // Belt
    b(bx_-3,torY+7,6,1,C.GRAY);b(bx_-2,torY+7,4,1,C.DKGRAY);p(bx_,torY+7,C.PINK);
    if(exec){p(bx_-4,torY+1,C.CRIM);p(bx_+4,torY+1,C.CRIM);p(bx_-4,torY+6,C.PINK);p(bx_+4,torY+6,C.PINK);}

    // ARMS & BLADE
    if(atk){
      if(dir===0){
        // slash down
        if(atkFrame===0){b(bx_+3,torY-2,2,3,C.DKPUR);for(let i=0;i<10;i++)p(bx_+5,torY-3-i,i===0?C.WHITE:i<3?C.LTCYN:C.CYAN);b(bx_+4,torY,3,1,C.GRAY);p(bx_+5,torY,C.PINK);}
        else{b(bx_+3,torY+2,2,3,C.DKPUR);for(let i=0;i<10;i++)p(bx_+5,torY+6+i,i===0?C.WHITE:i<3?C.LTCYN:C.CYAN);b(bx_+4,torY+5,3,1,C.GRAY);p(bx_+5,torY+5,C.PINK);for(let i=0;i<6;i++)p(bx_+4+i,torY+2+Math.floor(i*0.6),C.DKCYN);}
        b(bx_-5,torY+2,2,4,C.DKPUR);
      } else if(dir===1){
        if(atkFrame===0){b(bx_+3,torY-1,3,2,C.DKPUR);for(let i=0;i<10;i++)p(bx_+6,torY-2-i,i===0?C.WHITE:i<3?C.LTCYN:C.CYAN);b(bx_+5,torY+1,3,1,C.GRAY);p(bx_+6,torY+1,C.PINK);}
        else{b(bx_+3,torY+1,3,2,C.DKPUR);for(let i=0;i<10;i++){const x_=bx_+6+Math.floor(i*0.3),y_=torY+4+i;if(x_<32&&y_<63)p(x_,y_,i===0?C.WHITE:i<3?C.LTCYN:C.CYAN);}b(bx_+5,torY+3,3,1,C.GRAY);p(bx_+6,torY+3,C.PINK);}
      } else {
        if(atkFrame===0){b(bx_+3,torY-2,2,3,C.DKPUR);for(let i=0;i<8;i++)p(bx_+5,torY-3-i,i===0?C.WHITE:i<2?C.LTCYN:C.CYAN);b(bx_+4,torY,2,1,C.GRAY);}
        else{b(bx_+3,torY+3,2,3,C.DKPUR);for(let i=0;i<8;i++)p(bx_+5,torY+7+i,i<2?C.LTCYN:C.CYAN);b(bx_+4,torY+6,2,1,C.GRAY);}
      }
    } else {
      // idle/walk arms
      const aY=torY+1;
      if(dir===0){
        b(bx_-5,aY+armSwing,2,5,C.DKPUR);p(bx_-5,aY+armSwing,C.DEPUR);
        b(bx_+3,aY-armSwing,2,5,C.DKPUR);p(bx_+4,aY-armSwing,C.DEPUR);
        // blade at side
        for(let i=0;i<7;i++)p(bx_+5,aY-armSwing+2+i,i===0?C.LTCYN:i<3?C.CYAN:C.DKCYN);
      } else if(dir===1){
        b(bx_+3,aY-armSwing,2,5,C.DKPUR);p(bx_+4,aY-armSwing,C.DEPUR);
        for(let i=0;i<7;i++)p(bx_+5,aY-armSwing+2+i,i===0?C.LTCYN:i<3?C.CYAN:C.DKCYN);
      } else {
        b(bx_-5,aY+armSwing,2,5,C.DKPUR);p(bx_-5,aY+armSwing,C.DEPUR);
        b(bx_+3,aY-armSwing,2,5,C.DKPUR);p(bx_+4,aY-armSwing,C.DEPUR);
      }
    }

    // LEGS
    const lh=10;
    b(bx_-2+lOff,legY,2,lh,C.DKPUR);p(bx_-1+lOff,legY,C.DEPUR);
    b(bx_+1+rOff,legY,2,lh,C.DKPUR);p(bx_+2+rOff,legY,C.DEPUR);
    // knee guards
    b(bx_-2+lOff,legY+Math.floor(lh*0.5),2,1,C.GRAY);
    b(bx_+1+rOff,legY+Math.floor(lh*0.5),2,1,C.GRAY);
    // boots
    const lfy=Math.min(legY+lh,61),rfy=Math.min(legY+lh,61);
    b(bx_-3+lOff,lfy,4,2,C.DEPUR);b(bx_-3+lOff,lfy,3,1,C.MDPUR);
    b(bx_+rOff,rfy,4,2,C.DEPUR);b(bx_+1+rOff,rfy,3,1,C.MDPUR);
    // ground wisps
    if(!dash&&lfy+2<63){p(bx_-3+lOff,lfy+2,C.SHAD);p(bx_+3+rOff,rfy+2,C.SHAD);}

    // hurt flash
    if(hurt){p(bx_+4,headY+1,C.CRIM);p(bx_+5,headY,C.PINK);p(bx_+6,headY+1,C.CRIM);p(bx_+5,headY+2,C.PINK);}

    // Evade phase lines
    if(evade)for(let y=headY-2;y<legY+8;y+=3){p(bx_-7,y,C.DEPUR);p(bx_+7,y+1,C.DEPUR);}

    // exec ground marker
    if(exec){b(bx_-6,55,14,2,C.CRIM);b(bx_-5,54,12,1,C.DKPNK);b(bx_-4,57,10,1,C.DPNK);}
  }

  // Layout: 8 cols × 5 rows at 64×128
  // R0: Down  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R1: Side  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R2: Up    idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R3: Abilities dash1,dash2,evade1,evade2,exec1,exec2,ult1,ult2
  // R4: hurt,death1,death2,portrait,x,x,x,x

  const frames=[];
  // Per-direction rows
  for(let dir=0;dir<3;dir++){
    frames.push([
      {dir,opts:{}},
      {dir,opts:{armSwing:1}},
      {dir,opts:{lOff:1,rOff:-1,armSwing:1}},
      {dir,opts:{lOff:-1,rOff:1,armSwing:-1}},
      {dir,opts:{lOff:2,rOff:0,armSwing:1}},
      {dir,opts:{lOff:0,rOff:2,armSwing:-1}},
      {dir,opts:{atk:true,atkFrame:0,lOff:1}},
      {dir,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},
    ]);
  }
  // Abilities (all down-facing)
  frames.push([
    {dir:1,opts:{dash:true,lOff:2,rOff:1}},
    {dir:1,opts:{dash:true,lOff:3,rOff:2}},
    {dir:0,opts:{evade:true,lOff:-1,rOff:-1}},
    {dir:0,opts:{evade:true,lOff:1,rOff:1,armSwing:1}},
    {dir:0,opts:{exec:true,atk:true,atkFrame:0,lOff:1}},
    {dir:0,opts:{exec:true,atk:true,atkFrame:1,lOff:2,rOff:-1}},
    {dir:0,opts:{ult:true}},
    {dir:0,opts:{ult:true,lOff:1,rOff:-1,armSwing:1}},
  ]);
  // States
  frames.push([
    {dir:0,opts:{hurt:true,lOff:-1,rOff:-1}},
    {dir:0,opts:{custom:'death1'}},
    {dir:0,opts:{custom:'death2'}},
    {dir:0,opts:{custom:'portrait'}},
    null,null,null,null,
  ]);

  const cols=8,rows=5;
  frames.forEach((row,ry)=>{
    row.forEach((frame,rx)=>{
      if(!frame)return;
      const o=[rx*H_CW,ry*H_CH];
      if(frame.opts.custom==='death1'){
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        b(6,30,5,4,C.DKPUR);b(7,31,3,2,C.DEPUR);b(6,30,5,1,C.MDPUR);p(8,32,C.PINK);p(9,32,C.DKPNK);
        b(10,32,10,4,C.DKPUR);b(11,32,8,3,C.DEPUR);b(4,33,3,2,C.PINK);b(3,34,2,1,C.CRIM);p(2,35,C.DKPNK);
        b(20,34,6,2,C.DKPUR);b(22,36,4,2,C.DKPUR);b(24,29,1,6,C.DKCYN);p(24,28,C.CYAN);
        b(8,36,14,3,C.DKPUR);b(7,37,16,2,C.SHAD);
        for(let x=6;x<24;x++){if(x%3!==0)p(x,39,C.SHAD);if(x%4===0)p(x,40,C.VOID);}
        [[8,26,C.DEPUR],[14,24,C.SHAD],[20,27,C.DKPUR],[11,22,C.SHAD],[17,25,C.DEPUR]].forEach(([x,y,cl])=>p(x,y,cl));
      } else if(frame.opts.custom==='death2'){
        const{p}=mk(ctx,o,H_GW,H_GH,H_PX);
        for(let x=8;x<24;x++){if(x%2===0)p(x,42,C.SHAD);if(x%3===0)p(x,41,C.DKPUR);}
        p(22,36,C.DKCYN);p(22,35,C.CYAN);p(22,41,C.DKCYN);p(7,40,C.PINK);p(8,41,C.CRIM);p(6,41,C.DKPNK);
        [[10,35],[14,32],[18,37],[12,28],[20,30],[8,33],[16,26],[22,28],[11,24],[15,22],[19,34],[13,38],[17,40],[9,36],[21,32],[14,20],[16,18],[12,16],[18,24],[10,30]].forEach(([x,y],i)=>{
          p(x,y,i%5===0?C.PINK:i%4===0?C.BRPUR:i%3===0?C.DEPUR:i%2===0?C.DKPUR:C.SHAD);
        });
        p(14,42,C.PINK);p(15,42,C.DKPNK);
      } else if(frame.opts.custom==='portrait'){
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        b(2,2,28,60,C.VOID);b(3,3,26,58,C.SHAD);
        b(6,6,20,8,C.DKPUR);b(7,7,18,6,C.DEPUR);b(6,6,20,2,C.MDPUR);b(7,5,18,2,C.DEPUR);b(8,4,16,2,C.MDPUR);b(10,3,12,1,C.BRPUR);
        p(26,8,C.DKPUR);p(27,9,C.SHAD);p(28,10,C.SHAD);p(27,10,C.DKPUR);
        b(8,10,16,10,C.VOID);b(9,11,14,8,C.VOID);
        b(9,14,5,3,C.DKPNK);b(10,14,3,2,C.PINK);b(11,14,1,2,C.LTPNK);p(11,14,C.WHITE);
        b(18,14,5,3,C.DKPNK);b(19,14,3,2,C.PINK);b(20,14,1,2,C.LTPNK);p(20,14,C.WHITE);
        p(8,16,C.DKPNK);p(7,17,C.DPNK);p(23,16,C.DKPNK);p(24,17,C.DPNK);
        b(12,19,8,1,C.DKPUR);
        b(7,21,18,6,C.PINK);b(8,22,16,4,C.LTPNK);b(9,23,14,2,C.PAPNK);
        b(10,22,2,4,C.PINK);b(18,22,2,4,C.PINK);b(14,22,1,4,C.PINK);
        b(4,20,4,6,C.DKPUR);b(5,20,2,5,C.DEPUR);b(24,20,4,6,C.DKPUR);b(25,20,2,5,C.DEPUR);
        b(8,27,16,14,C.DKPUR);b(9,27,14,12,C.DEPUR);
        p(10,29,C.MDPUR);p(12,30,C.MDPUR);p(14,31,C.MDPUR);p(16,30,C.MDPUR);p(18,29,C.MDPUR);
        b(24,28,2,10,C.GRAY);p(25,27,C.CYAN);p(24,26,C.DKCYN);
        b(2,2,28,1,C.MDPUR);b(2,61,28,1,C.MDPUR);b(2,2,1,60,C.MDPUR);b(29,2,1,60,C.MDPUR);
        p(3,3,C.PINK);p(28,3,C.PINK);p(3,60,C.PINK);p(28,60,C.PINK);
      } else {
        drawChar(ctx,o,frame.dir,frame.opts);
      }
    });
  });
  return{cols,rows,cw:H_CW,ch:H_CH};
}

// ===== LABELS =====
const T_NAMES=['Gambler','Spike','Siphon','Rift','Oblivion'];
const T_STATES=['Idle','Charge','Fire','Cooldown'];
const P_NAMES=['Coin','Shard','Gold Orb','Portal','Void Eye'];
const P_STATES=['Travel 1','Travel 2','Travel 3','Impact 1','Impact 2','Impact 3'];
const H_COL_LABELS=['Idle 1','Idle 2','Walk 1','Walk 2','Walk 3','Walk 4','Atk 1','Atk 2'];
const H_ROW_LABELS=['Down','Side','Up','Abilities','States'];
const H_R3=['Dash 1','Dash 2','Evade 1','Evade 2','Exec 1','Exec 2','Ult 1','Ult 2'];
const H_R4=['Hurt','Death 1','Death 2','Portrait','','','',''];

// ===== COMPONENT =====
window._faction_void = function App(){
  const tRef=useRef(),tPv=useRef(),pRef=useRef(),pPv=useRef(),hRef=useRef(),hPv=useRef();
  const [ready,setReady]=useState(false);
  const [tab,setTab]=useState('towers');
  const [view,setView]=useState('preview');

  useEffect(()=>{
    // Towers
    const tc=tRef.current;tc.width=5*T_CELL;tc.height=4*T_CELL;
    const tCtx=tc.getContext('2d');tCtx.imageSmoothingEnabled=false;
    drawTowers(tCtx);
    // Tower preview
    const tpv=tPv.current;const tS=2,tLW=66,tLH=13;
    tpv.width=tLW+5*T_CELL*tS;tpv.height=4*(T_CELL*tS+tLH)+10;
    const tpc=tpv.getContext('2d');tpc.imageSmoothingEnabled=false;
    tpc.fillStyle='#07050c';tpc.fillRect(0,0,tpv.width,tpv.height);
    for(let r=0;r<4;r++){const by=r*(T_CELL*tS+tLH)+5;tpc.fillStyle='#6644aa';tpc.font='bold 9px monospace';tpc.fillText(T_STATES[r],3,by+T_CELL*tS/2+3);
      for(let cc=0;cc<5;cc++){const bx_=tLW+cc*T_CELL*tS;tpc.save();tpc.translate(bx_,by);tpc.scale(tS,tS);tpc.drawImage(tc,cc*T_CELL,r*T_CELL,T_CELL,T_CELL,0,0,T_CELL,T_CELL);tpc.restore();tpc.strokeStyle='#1a1a2a';tpc.strokeRect(bx_,by,T_CELL*tS,T_CELL*tS);if(r===0){tpc.fillStyle='#887799';tpc.font='9px monospace';tpc.fillText(T_NAMES[cc],bx_+2,by-2);}}}

    // Projectiles
    const pc_=pRef.current;pc_.width=5*P_CELL;pc_.height=6*P_CELL;
    const pCtx=pc_.getContext('2d');pCtx.imageSmoothingEnabled=false;
    drawProjectiles(pCtx);
    const ppv=pPv.current;const pS=3;
    ppv.width=tLW+5*P_CELL*pS;ppv.height=6*(P_CELL*pS+tLH)+10;
    const ppc=ppv.getContext('2d');ppc.imageSmoothingEnabled=false;
    ppc.fillStyle='#07050c';ppc.fillRect(0,0,ppv.width,ppv.height);
    for(let r=0;r<6;r++){const by=r*(P_CELL*pS+tLH)+5;ppc.fillStyle='#6644aa';ppc.font='bold 9px monospace';ppc.fillText(P_STATES[r],3,by+P_CELL*pS/2+3);
      for(let cc=0;cc<5;cc++){const bx_=tLW+cc*P_CELL*pS;ppc.save();ppc.translate(bx_,by);ppc.scale(pS,pS);ppc.drawImage(pc_,cc*P_CELL,r*P_CELL,P_CELL,P_CELL,0,0,P_CELL,P_CELL);ppc.restore();ppc.strokeStyle='#1a1a2a';ppc.strokeRect(bx_,by,P_CELL*pS,P_CELL*pS);if(r===0){ppc.fillStyle='#887799';ppc.font='9px monospace';ppc.fillText(P_NAMES[cc],bx_+2,by-2);}}}

    // Hero
    const hc=hRef.current;hc.width=8*H_CW;hc.height=5*H_CH;
    const hCtx=hc.getContext('2d');hCtx.imageSmoothingEnabled=false;
    drawHero(hCtx);
    const hpv=hPv.current;const hS=1.4,hLW=72,hLH=13;
    hpv.width=hLW+8*H_CW*hS;hpv.height=5*(H_CH*hS+hLH)+10;
    const hpc=hpv.getContext('2d');hpc.imageSmoothingEnabled=false;
    hpc.fillStyle='#07050c';hpc.fillRect(0,0,hpv.width,hpv.height);
    for(let r=0;r<5;r++){const by=r*(H_CH*hS+hLH)+5;hpc.fillStyle='#6644aa';hpc.font='bold 9px monospace';hpc.fillText(H_ROW_LABELS[r],3,by+H_CH*hS/2+3);
      for(let cc=0;cc<8;cc++){const bx_=hLW+cc*H_CW*hS;hpc.save();hpc.translate(bx_,by);hpc.scale(hS,hS);hpc.drawImage(hc,cc*H_CW,r*H_CH,H_CW,H_CH,0,0,H_CW,H_CH);hpc.restore();hpc.strokeStyle='#1a1a2a';hpc.strokeRect(bx_,by,H_CW*hS,H_CH*hS);
        hpc.fillStyle='#887799';hpc.font='8px monospace';
        const lbl=r<3?H_COL_LABELS[cc]:r===3?H_R3[cc]:H_R4[cc];
        if(lbl)hpc.fillText(lbl,bx_+2,by+H_CH*hS+10);}}

    setReady(true);
  },[]);

  const dl=(ref,name)=>()=>{const a=document.createElement('a');a.download=name;a.href=ref.current.toDataURL('image/png');a.click();};

  const tabs=[
    {id:'towers',label:'Towers',ref:tRef,pvRef:tPv,dl:'void_towers_animated.png',
      info:{sz:'320×256',cell:'64×64',loader:"this.load.spritesheet('void_towers','void_towers_animated.png',{frameWidth:64,frameHeight:64})",note:'5 cols (towers) × 4 rows (idle, charge, fire, cooldown)'}},
    {id:'projectiles',label:'Projectiles',ref:pRef,pvRef:pPv,dl:'void_projectiles_animated.png',
      info:{sz:'160×192',cell:'32×32',loader:"this.load.spritesheet('void_proj','void_projectiles_animated.png',{frameWidth:32,frameHeight:32})",note:'5 cols × 6 rows (3 travel + 3 impact)'}},
    {id:'hero',label:'Hero: Shadow',ref:hRef,pvRef:hPv,dl:'shadow_hero_directional.png',
      info:{sz:'512×640',cell:'64×128',loader:"this.load.spritesheet('shadow','shadow_hero_directional.png',{frameWidth:64,frameHeight:128})",note:'Row 0-2: Down/Side/Up (idle×2, walk×4, atk×2) · Row 3: Abilities · Row 4: States'}},
  ];
  const cur=tabs.find(t=>t.id===tab);

  return(
    <div style={{background:'#07050c',minHeight:'100vh',padding:12,fontFamily:'monospace'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}}>
        <h2 style={{color:C.PINK,margin:0,fontSize:15}}>VOID FACTION — Complete Sheets</h2>
        {ready&&<button onClick={dl(cur.ref,cur.dl)} style={{background:C.PINK,color:'#fff',border:'none',padding:'5px 14px',borderRadius:3,cursor:'pointer',fontFamily:'monospace',fontWeight:'bold',fontSize:11}}>
          Download {cur.label} PNG
        </button>}
      </div>
      <div style={{display:'flex',gap:5,marginBottom:8,flexWrap:'wrap'}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?'#2a1155':'#111',color:tab===t.id?C.PINK:'#665588',border:`1px solid ${tab===t.id?'#4422aa':'#222'}`,padding:'4px 10px',borderRadius:3,cursor:'pointer',fontFamily:'monospace',fontSize:10}}>{t.label}</button>
        ))}
        <span style={{borderLeft:'1px solid #222',margin:'0 2px'}}/>
        {['preview','actual'].map(v=>(
          <button key={v} onClick={()=>setView(v)} style={{background:view===v?'#1a1a2a':'#111',color:view===v?C.CYAN:'#445566',border:`1px solid ${view===v?'#334':'#222'}`,padding:'4px 8px',borderRadius:3,cursor:'pointer',fontFamily:'monospace',fontSize:10,textTransform:'capitalize'}}>{v==='actual'?'Actual Size':v}</button>
        ))}
      </div>
      <div style={{overflowX:'auto',overflowY:'auto',maxHeight:'70vh'}}>
        {tabs.map(t=>(
          <div key={t.id} style={{display:tab===t.id?'block':'none'}}>
            <canvas ref={t.pvRef} style={{display:view==='preview'?'block':'none',maxWidth:'100%'}}/>
            <canvas ref={t.ref} style={{display:view==='actual'?'block':'none',imageRendering:'pixelated',width:t.id==='hero'?8*H_CW*1.5:t.id==='projectiles'?5*P_CELL*3:5*T_CELL*2,border:'1px solid #1a1a2a'}}/>
          </div>
        ))}
      </div>
      {cur&&<div style={{color:'#554477',fontSize:9,marginTop:10,maxWidth:600}}>
        <p style={{margin:'2px 0'}}><b style={{color:'#8866bb'}}>Sheet:</b> {cur.info.sz}px · {cur.info.cell} cells</p>
        <p style={{margin:'2px 0'}}><b style={{color:'#8866bb'}}>Phaser:</b> <code style={{color:C.CYAN}}>{cur.info.loader}</code></p>
        <p style={{margin:'2px 0'}}><b style={{color:'#8866bb'}}>Layout:</b> {cur.info.note}</p>
      </div>}
    </div>
  );
}

// ===== PALETTE =====
const C={
  DVIO:'#220044',DKVIO:'#331166',MDVIO:'#442288',BRVIO:'#6644ff',LTVIO:'#9988ff',PLVIO:'#bbaaff',
  LAV:'#cc88ff',LTLAV:'#dd99ff',PLLAV:'#eeccff',
  DKBLU:'#223388',MDBLU:'#4466cc',LTBLU:'#88aaff',PLBLU:'#bbddff',
  ICE:'#aaddff',DKICE:'#6699cc',LTICE:'#cceeFF',WHITE:'#ffffff',
  YEL:'#ffdd44',LTYEL:'#ffee88',PLYEL:'#ffffcc',DKYEL:'#ccaa22',
  RED:'#ff4422',DKRED:'#cc2211',LTRED:'#ff7744',ORG:'#ff8833',LTORG:'#ffaa55',
  GOLD:'#ffcc00',DKGLD:'#aa8800',LTGLD:'#ffee88',
  VOID:'#0a0016',SHAD:'#110022',DKPUR:'#1a0033',
  CYAN:'#00ffcc',DKCYN:'#009977',LTCYN:'#66ffe6',
  GRAY:'#665577',DKGRAY:'#332244',
  PINK:'#ff66aa',
};

// ===== DRAWING HELPERS =====
const mk=(c:CanvasRenderingContext2D,o[],gw,gh,ps)=>{
  const p=(x,y,cl)=>{if(!cl||x<0||x>=gw||y<0||y>=gh)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,ps,ps);};
  const b=(x,y,w,h,cl)=>{if(!cl)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,w*ps,h*ps);};
  return{p,b};
};

// ===== TOWER HELPERS =====
const T_PX=2,T_G=32,T_CELL=T_G*T_PX;

// Shared arcane crystal base — layered crystal pedestal with glowing runes
function arcaneBase(p:(x,y,cl)=>void,b:(x,y,w,h,cl)=>void,topY,w,glow){
  const cx=16;
  // Crystal pedestal layers
  for(let i=0;i<8;i++){
    const cw=w-4+Math.floor(i*0.6),sx=cx-Math.floor(cw/2);
    b(sx,topY+i,cw,1,i<2?C.MDVIO:i<4?C.DKVIO:i<6?C.DVIO:C.SHAD);
  }
  // Top highlight
  b(cx-Math.floor((w-4)/2),topY,w-4,1,glow>1?C.LTVIO:C.BRVIO);
  // Crystal facets on pedestal
  p(cx-4,topY+1,glow>0?C.LTVIO:C.MDVIO);p(cx+3,topY+1,glow>0?C.LTVIO:C.MDVIO);
  p(cx-3,topY+3,C.DKVIO);p(cx+2,topY+3,C.DKVIO);
  // Rune marks on base
  p(cx-5,topY+5,glow>1?C.LAV:C.BRVIO);p(cx+4,topY+5,glow>1?C.LAV:C.BRVIO);
  p(cx-3,topY+6,glow>0?C.LTVIO:C.MDVIO);p(cx+2,topY+6,glow>0?C.LTVIO:C.MDVIO);
  // Bottom shadow
  b(cx-Math.floor(w/2),topY+7,w,1,C.VOID);
  // Floating rune particles
  if(glow>0){
    p(cx-6,topY+3,C.LAV);p(cx+5,topY+2,C.LAV);
  }
  if(glow>1){
    p(cx-7,topY+1,C.PLLAV);p(cx+6,topY+1,C.PLLAV);
  }
}

// Energy tendril connecting base to floating element
function arcaneTendril(p:(x,y,cl)=>void,x1,y1,x2,y2,col,bright){
  const dy=y2-y1,dx=x2-x1;
  for(let i=0;i<=Math.abs(dy);i++){
    const t=i/Math.max(1,Math.abs(dy));
    const yy=y1+Math.round(i*Math.sign(dy));
    const xx=Math.round(x1+dx*t+Math.sin(t*Math.PI*3)*1.2);
    p(xx,yy,bright&&i%2===0?C.PLLAV:col);
  }
}

// Crystal spire helper
function crystalSpire(p:(x,y,cl)=>void,b:(x,y,w,h,cl)=>void,x,y,h,w,c1,c2,ct){
  for(let i=0;i<h;i++){
    const pr=i/h,cw=Math.max(1,Math.round(w*(1-pr*0.85)));
    b(x+Math.floor((w-cw)/2),y+h-1-i,cw,1,pr<0.15?ct:pr<0.5?c2:c1);
  }
}

// Floating orbiting crystal mark (signature above each tower)
function arcaneOrbit(p:(x,y,cl)=>void,cx,cy,phase,col){
  const ox=cx+Math.round(Math.cos(phase)*3);
  const oy=cy+Math.round(Math.sin(phase)*1.5);
  p(ox,oy,col);
  p(ox,oy-1,C.PLLAV);
}

// ===== TOWERS (7×4 at 64×64) =====
function drawTowers(ctx:CanvasRenderingContext2D){
  const fns=[
    // 1. Bolt — Small crystal that fires rapid pulses
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,23,18,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      // Small floating crystal
      const cy=fl?10:br?11:12;
      // Crystal body - diamond shape
      for(let i=0;i<6;i++){const hw=i<3?i+1:6-i;b(16-hw,cy-3+i,hw*2,1,i<2?C.PLLAV:i<4?C.LTVIO:C.BRVIO);}
      // Inner glow
      b(15,cy-1,2,2,fl?C.WHITE:br?C.PLLAV:C.LTVIO);
      p(16,cy,fl?C.WHITE:C.LTVIO);
      // Tendrils
      arcaneTendril(p,14,cy+3,13,23,br?C.LTVIO:C.BRVIO,fl);
      arcaneTendril(p,18,cy+3,19,23,br?C.LTVIO:C.BRVIO,fl);
      // Orbiting crystal
      arcaneOrbit(p,16,cy-5,s*1.5,C.LAV);
      // Pulse particles
      if(br){p(10,cy-1,C.LAV);p(22,cy,C.LAV);}
      if(fl){
        // Outward burst
        for(let i=0;i<6;i++){const a=i*Math.PI/3;p(16+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*4),C.PLLAV);}
        p(16,cy-4,C.WHITE);p(16,cy+4,C.WHITE);
      }
      if(s===3){p(15,cy,C.MDVIO);p(17,cy,C.MDVIO);} // dim
    },
    // 2. Frost — Ice crystal formation with cold mist
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,23,20,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      // Main ice crystal - tall hexagonal
      const cy=fl?8:br?9:10;
      crystalSpire(p,b,14,cy-4,12,4,C.DKICE,fl?C.LTICE:C.ICE,fl?C.WHITE:C.LTICE);
      // Side ice shards
      crystalSpire(p,b,9,cy,8,3,C.DKICE,br?C.ICE:C.DKICE,br?C.LTICE:C.ICE);
      crystalSpire(p,b,21,cy-1,9,3,C.DKICE,br?C.ICE:C.DKICE,br?C.LTICE:C.ICE);
      // Cold mist - blue-white tint
      if(br){
        for(let i=0;i<5;i++){p(8+i*3,cy+10,C.DKICE);p(9+i*3,cy+11,C.PLBLU);}
      }
      // Frost particles
      p(12,cy-2,fl?C.WHITE:C.LTICE);p(20,cy-1,fl?C.WHITE:C.LTICE);
      if(fl){
        // Blizzard burst
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(16+Math.round(Math.cos(a)*6),cy+3+Math.round(Math.sin(a)*5),i%2?C.WHITE:C.LTICE);}
        b(14,cy-5,4,1,C.WHITE);
      }
      // Tendrils (icy blue)
      arcaneTendril(p,14,cy+8,13,23,C.DKICE,fl);
      arcaneTendril(p,18,cy+8,19,23,C.DKICE,fl);
      // Orbiting crystal
      arcaneOrbit(p,16,cy-6,s*1.2,C.LTICE);
      if(s===3){p(15,cy,C.DKICE);p(16,cy+1,C.DKICE);} // dim
    },
    // 3. Storm — Crackling orb of lightning
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,23,20,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      const cy=fl?9:br?10:11;
      // Crackling orb
      for(let r=4;r>0;r--)for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        p(16+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),r>3?C.DKYEL:r>2?C.YEL:r>1?C.LTYEL:C.WHITE);
      }
      b(15,cy-1,2,2,fl?C.WHITE:C.LTYEL);
      p(16,cy,C.WHITE);
      // Lightning bolts/sparks
      const sparks=fl?[[8,cy-2],[24,cy-3],[7,cy+2],[25,cy+1],[12,cy-5],[20,cy-4]]:
        br?[[10,cy-1],[22,cy],[9,cy+3],[23,cy+2]]:
        [[11,cy],[21,cy+1]];
      sparks.forEach(([x,y])=>p(x,y,C.LTYEL));
      // Jagged lightning lines
      if(br){
        // Left bolt
        p(13,cy-3,C.YEL);p(12,cy-4,C.LTYEL);p(14,cy-5,C.YEL);
        // Right bolt
        p(19,cy-2,C.YEL);p(20,cy-3,C.LTYEL);p(18,cy-4,C.YEL);
      }
      if(fl){
        // Electric discharge burst
        for(let i=0;i<12;i++){const a=i*Math.PI/6;p(16+Math.round(Math.cos(a)*7),cy+Math.round(Math.sin(a)*6),i%3===0?C.WHITE:i%2?C.LTYEL:C.YEL);}
        p(16,cy-6,C.WHITE);p(16,cy+6,C.WHITE);
      }
      // Tendrils
      arcaneTendril(p,14,cy+4,13,23,br?C.YEL:C.DKYEL,fl);
      arcaneTendril(p,18,cy+4,19,23,br?C.YEL:C.DKYEL,fl);
      arcaneOrbit(p,16,cy-7,s*1.8,C.LTYEL);
      if(s===3){b(14,cy-1,4,3,C.DKYEL);p(16,cy,C.YEL);} // dim
    },
    // 4. Focus — Tall thin crystal lens
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,24,18,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      // Tall thin crystal lens
      const topY=fl?2:br?3:4;
      crystalSpire(p,b,15,topY,18,2,C.DKVIO,fl?C.LTVIO:C.BRVIO,fl?C.PLLAV:C.LTVIO);
      // Lens facets - wider middle section
      b(13,topY+8,6,3,C.MDVIO);b(14,topY+9,4,1,fl?C.PLLAV:br?C.LTVIO:C.BRVIO);
      // Lens center glow
      p(16,topY+9,fl?C.WHITE:br?C.PLLAV:C.LTVIO);
      p(15,topY+9,fl?C.PLLAV:C.LTVIO);
      // Side facet lines
      p(12,topY+7,C.BRVIO);p(19,topY+7,C.BRVIO);
      p(12,topY+10,C.MDVIO);p(19,topY+10,C.MDVIO);
      // Focus beam indicator
      if(br){
        p(16,topY-1,C.PLLAV);p(16,topY-2,C.LAV);
      }
      if(fl){
        // Focused beam upward
        for(let i=0;i<4;i++)p(16,topY-1-i,i===0?C.WHITE:C.PLLAV);
        p(15,topY-2,C.LAV);p(17,topY-2,C.LAV);
      }
      // Tendrils
      arcaneTendril(p,15,topY+16,14,24,br?C.LTVIO:C.BRVIO,fl);
      arcaneTendril(p,17,topY+16,18,24,br?C.LTVIO:C.BRVIO,fl);
      arcaneOrbit(p,16,topY-3,s*1.0,C.LAV);
      if(s===3){p(16,topY+9,C.MDVIO);} // dim
    },
    // 5. Mana Drain — Dark crystal that pulls energy (inverse glow)
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,23,20,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      const cy=fl?9:br?10:11;
      // Dark crystal - inverted colors (dark core, bright edges)
      for(let i=0;i<8;i++){const hw=i<4?i+1:8-i;b(16-hw,cy-4+i,hw*2,1,C.BRVIO);}
      for(let i=1;i<7;i++){const hw=i<4?i:7-i;b(16-hw+1,cy-4+i,Math.max(1,hw*2-2),1,C.DVIO);}
      // Void core
      b(15,cy-1,2,2,C.VOID);p(16,cy,C.SHAD);
      // Sucking effect - particles moving inward
      const succ=fl?[[6,cy-2],[26,cy-1],[8,cy+4],[24,cy+3],[5,cy+1],[27,cy],[10,cy-4],[22,cy-3]]:
        br?[[8,cy-1],[24,cy],[9,cy+3],[23,cy+2],[7,cy+1],[25,cy]]:
        [[10,cy],[22,cy+1],[11,cy+2],[21,cy+2]];
      succ.forEach(([x,y],i)=>p(x,y,i%2?C.LTVIO:C.LAV));
      // Drain tendrils (reaching outward to pull)
      if(br){
        p(9,cy-3,C.MDVIO);p(23,cy-2,C.MDVIO);
        arcaneTendril(p,12,cy,8,cy-2,C.DKVIO,false);
        arcaneTendril(p,20,cy,24,cy-1,C.DKVIO,false);
      }
      if(fl){
        // Implosion lines
        for(let i=0;i<8;i++){const a=i*Math.PI/4;
          p(16+Math.round(Math.cos(a)*7),cy+Math.round(Math.sin(a)*6),C.LAV);
          p(16+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*4),C.LTVIO);
        }
      }
      arcaneTendril(p,14,cy+4,13,23,C.MDVIO,fl);
      arcaneTendril(p,18,cy+4,19,23,C.MDVIO,fl);
      arcaneOrbit(p,16,cy-6,s*1.3,C.DVIO);
      if(s===3){p(15,cy-1,C.DVIO);p(16,cy,C.DVIO);} // dim
    },
    // 6. Meteor — Large burning crystal, red-orange glow, falling star motif
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,24,20,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      const cy=fl?8:br?9:10;
      // Large burning crystal
      for(let i=0;i<10;i++){const hw=i<5?i+1:10-i;b(16-hw,cy-5+i,hw*2,1,i<3?C.LTRED:i<6?C.RED:i<8?C.DKRED:C.DVIO);}
      // Inner fire
      for(let i=1;i<8;i++){const hw=i<4?i:8-i;b(16-hw+1,cy-4+i,Math.max(1,hw*2-2),1,i<3?C.LTORG:i<5?C.ORG:C.RED);}
      // Hot core
      b(15,cy-1,2,2,fl?C.WHITE:br?C.LTYEL:C.ORG);
      p(16,cy,fl?C.WHITE:C.LTYEL);
      // Falling star trail at top
      if(br){
        p(16,cy-6,C.LTORG);p(15,cy-7,C.ORG);p(17,cy-7,C.ORG);
        p(16,cy-8,C.RED);
      }
      if(fl){
        // Massive fire burst
        for(let i=0;i<10;i++){const a=i*Math.PI/5;
          p(16+Math.round(Math.cos(a)*7),cy+Math.round(Math.sin(a)*6),i%2?C.LTRED:C.ORG);
          p(16+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*4),C.LTYEL);
        }
        p(16,cy-7,C.WHITE);p(15,cy-8,C.LTYEL);p(17,cy-8,C.LTYEL);
      }
      // Ember particles
      p(10,cy-3,br?C.ORG:C.RED);p(22,cy-2,br?C.ORG:C.RED);
      p(8,cy+2,C.DKRED);p(24,cy+1,C.DKRED);
      arcaneTendril(p,14,cy+5,13,24,br?C.RED:C.DKRED,fl);
      arcaneTendril(p,18,cy+5,19,24,br?C.RED:C.DKRED,fl);
      arcaneOrbit(p,16,cy-9,s*1.6,C.LTORG);
      if(s===3){b(14,cy-2,4,4,C.DKRED);p(16,cy,C.RED);} // dim
    },
    // 7. Arcane Nova (Ultimate) — Massive multi-crystal formation, all colors combined
    (c:CanvasRenderingContext2D,o[],s)=>{const{p,b}=mk(c,o,T_G,T_G,T_PX);
      arcaneBase(p,b,24,24,s===1?1:s===2?2:0);
      const br=s>=1,fl=s===2;
      const cy=fl?7:br?8:9;
      // Central massive crystal
      for(let i=0;i<12;i++){const hw=i<6?i+2:14-i;b(16-hw,cy-6+i,hw*2,1,i<3?C.PLLAV:i<6?C.LTVIO:i<9?C.BRVIO:C.MDVIO);}
      // Inner rainbow core
      for(let i=2;i<10;i++){const hw=i<5?i-1:10-i;if(hw>0)b(16-hw+1,cy-4+i,Math.max(1,hw*2-2),1,
        i<4?C.LTICE:i<6?C.LTYEL:i<8?C.LTRED:C.LAV);}
      // Bright core
      b(15,cy-1,2,3,fl?C.WHITE:br?C.PLLAV:C.LTVIO);
      p(16,cy,C.WHITE);
      // Side crystal formations
      crystalSpire(p,b,7,cy-2,10,3,C.DKICE,C.ICE,C.LTICE);
      crystalSpire(p,b,23,cy-1,9,3,C.DKRED,C.RED,C.LTRED);
      crystalSpire(p,b,5,cy+2,7,2,C.DKYEL,C.YEL,C.LTYEL);
      crystalSpire(p,b,25,cy+1,8,2,C.DKVIO,C.BRVIO,C.LTVIO);
      // Multi-color glow particles
      const colors=[C.LAV,C.LTICE,C.LTYEL,C.LTRED,C.LTVIO,C.PLLAV,C.PLBLU,C.PLYEL];
      if(br){
        for(let i=0;i<8;i++){const a=i*Math.PI/4;
          p(16+Math.round(Math.cos(a)*8),cy+Math.round(Math.sin(a)*7),colors[i]);
        }
      }
      if(fl){
        // Rainbow nova blast
        for(let i=0;i<16;i++){const a=i*Math.PI/8;
          p(16+Math.round(Math.cos(a)*10),cy+Math.round(Math.sin(a)*8),colors[i%8]);
          p(16+Math.round(Math.cos(a)*8),cy+Math.round(Math.sin(a)*6),C.WHITE);
        }
        b(14,cy-7,4,1,C.WHITE);b(13,cy-8,6,1,C.PLLAV);
      }
      // Multiple tendrils
      arcaneTendril(p,13,cy+6,11,24,br?C.LTVIO:C.BRVIO,fl);
      arcaneTendril(p,16,cy+6,16,24,br?C.LAV:C.MDVIO,fl);
      arcaneTendril(p,19,cy+6,21,24,br?C.LTVIO:C.BRVIO,fl);
      // Multiple orbiting crystals
      arcaneOrbit(p,16,cy-8,s*1.0,C.LTICE);
      arcaneOrbit(p,12,cy-6,s*1.5+2,C.LTYEL);
      arcaneOrbit(p,20,cy-6,s*1.5+4,C.LTRED);
      if(s===3){
        // Dim all
        b(13,cy-3,6,6,C.MDVIO);b(14,cy-2,4,4,C.DKVIO);p(16,cy,C.BRVIO);
      }
    },
  ];
  const cols=7,rows=4;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*T_CELL,row*T_CELL],row);
  return{cols,rows,cell:T_CELL};
}

// ===== PROJECTILES (7×6 at 32×32) =====
const P_PX=2,P_G=16,P_CELL=P_G*P_PX;

function drawProjectiles(ctx:CanvasRenderingContext2D){
  const fns=[
    // Bolt — purple energy ball → purple burst
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        const r=[3,3,4][f],bob=[0,-1,1][f];
        for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r){
          const d=Math.sqrt(x*x+y*y);p(cx+x,cy+y+bob,d<1?C.WHITE:d<r*0.5?C.PLLAV:d<r*0.8?C.LTVIO:C.BRVIO);
        }
        p(cx-r-1,cy+bob,C.MDVIO);p(cx+r+1,cy+bob,C.MDVIO);
        // Trail
        if(f>0){p(cx-3-f,cy+bob+1,C.MDVIO);p(cx-4-f,cy+bob,C.BRVIO);}
      }else if(f===3){
        // Impact 1 — burst outward
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),i%2?C.LTVIO:C.BRVIO);}
        b(cx-2,cy-2,4,4,C.LTVIO);b(cx-1,cy-1,2,2,C.PLLAV);p(cx,cy,C.WHITE);
      }else if(f===4){
        for(let i=0;i<10;i++){const a=i*Math.PI/5,r=4+i%2;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%3===0?C.PLLAV:C.MDVIO);}
        p(cx,cy,C.LTVIO);p(cx+1,cy-1,C.BRVIO);
      }else{
        [[4,5],[12,4],[6,11],[10,12],[3,8],[13,7]].forEach(([x,y],i)=>p(x,y,i%2?C.MDVIO:C.BRVIO));
        p(cx,cy,C.MDVIO);
      }
    },
    // Frost — ice shard → ice shatter
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        const ang=[-1,0,1][f];
        // Ice shard — elongated crystal
        for(let i=0;i<10;i++){const w=i<2?1:i<8?2:1,sx=cx-Math.floor(w/2)+ang*(i<5?0:1);
          b(sx,cy-5+i,w,1,i<2?C.WHITE:i<4?C.LTICE:i<7?C.ICE:C.DKICE);
        }
        p(cx-2,cy-2,C.DKICE);p(cx+2,cy+2,C.DKICE);
      }else if(f===3){
        // Ice shatter 1
        for(let i=0;i<8;i++){const a=i*Math.PI/4;
          p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),i%2?C.ICE:C.LTICE);
          p(cx+Math.round(Math.cos(a)*2),cy+Math.round(Math.sin(a)*2),C.WHITE);
        }
        p(cx,cy,C.WHITE);
      }else if(f===4){
        for(let i=0;i<12;i++){const a=i*Math.PI/6,r=3+i%3;p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%3===0?C.LTICE:C.DKICE);}
        p(cx,cy,C.ICE);
      }else{
        [[4,4],[11,5],[6,12],[9,3],[3,8],[13,9]].forEach(([x,y],i)=>p(x,y,i%2?C.DKICE:C.ICE));
      }
    },
    // Storm — lightning bolt → electrical discharge
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Lightning bolt shape — jagged vertical
        const off=[0,1,-1][f];
        p(cx+off,cy-5,C.LTYEL);p(cx+off+1,cy-4,C.WHITE);p(cx+off,cy-3,C.LTYEL);
        p(cx+off-1,cy-2,C.WHITE);p(cx+off,cy-1,C.LTYEL);p(cx+off+1,cy,C.WHITE);
        p(cx+off,cy+1,C.LTYEL);p(cx+off-1,cy+2,C.YEL);p(cx+off,cy+3,C.DKYEL);
        p(cx+off+1,cy+4,C.DKYEL);
        // Side sparks
        p(cx-3,cy-1+f,C.YEL);p(cx+3,cy+1-f,C.YEL);
      }else if(f===3){
        // Electrical discharge 1
        for(let i=0;i<8;i++){const a=i*Math.PI/4;
          p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),C.YEL);
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.LTYEL);
        }
        p(cx,cy,C.WHITE);b(cx-1,cy-1,2,2,C.LTYEL);
      }else if(f===4){
        for(let i=0;i<10;i++){const a=i*Math.PI/5,r=4+i%2;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%2?C.DKYEL:C.YEL);
        }
        p(cx-1,cy,C.YEL);p(cx+1,cy,C.YEL);p(cx,cy,C.LTYEL);
      }else{
        [[3,5],[12,4],[5,11],[10,12],[7,3],[9,13]].forEach(([x,y],i)=>p(x,y,i%2?C.DKYEL:C.YEL));
        p(cx,cy,C.DKYEL);
      }
    },
    // Focus — thin beam point → focused flash
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Thin beam point — narrow bright line
        const len=[6,7,8][f];
        for(let i=0;i<len;i++){
          p(cx,cy-Math.floor(len/2)+i,i===0?C.WHITE:i<2?C.PLLAV:i<len-1?C.LTVIO:C.BRVIO);
        }
        // Side shimmer
        p(cx-1,cy,f===1?C.LTVIO:C.BRVIO);p(cx+1,cy,f===2?C.LTVIO:C.BRVIO);
      }else if(f===3){
        // Focused flash — bright cross
        b(cx-1,cy-4,2,8,C.LTVIO);b(cx-4,cy-1,8,2,C.LTVIO);
        b(cx-1,cy-2,2,4,C.PLLAV);b(cx-2,cy-1,4,2,C.PLLAV);
        p(cx,cy,C.WHITE);
      }else if(f===4){
        // Fading cross
        p(cx,cy-3,C.BRVIO);p(cx,cy+3,C.BRVIO);p(cx-3,cy,C.BRVIO);p(cx+3,cy,C.BRVIO);
        b(cx-1,cy-1,2,2,C.LTVIO);p(cx,cy,C.PLLAV);
      }else{
        p(cx,cy,C.MDVIO);p(cx,cy-1,C.DKVIO);p(cx,cy+1,C.DKVIO);p(cx-1,cy,C.DKVIO);p(cx+1,cy,C.DKVIO);
      }
    },
    // Mana Drain — dark orb with tendrils → void implosion
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        const r=[3,3,4][f];
        // Dark orb
        for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r){
          const d=Math.sqrt(x*x+y*y);p(cx+x,cy+y,d<1?C.VOID:d<r*0.5?C.SHAD:d<r*0.8?C.DVIO:C.BRVIO);
        }
        // Tendrils reaching out
        const ta=f*0.8;
        for(let i=0;i<4;i++){const a=ta+i*Math.PI/2;
          p(cx+Math.round(Math.cos(a)*(r+2)),cy+Math.round(Math.sin(a)*(r+2)),C.LTVIO);
          p(cx+Math.round(Math.cos(a)*(r+1)),cy+Math.round(Math.sin(a)*(r+1)),C.MDVIO);
        }
      }else if(f===3){
        // Void implosion 1 — ring collapsing
        for(let i=0;i<12;i++){const a=i*Math.PI/6;
          p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),i%2?C.BRVIO:C.LTVIO);
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.MDVIO);
        }
        b(cx-1,cy-1,2,2,C.VOID);p(cx,cy,C.DVIO);
      }else if(f===4){
        for(let i=0;i<8;i++){const a=i*Math.PI/4;p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.DKVIO);}
        b(cx-2,cy-2,4,4,C.VOID);b(cx-1,cy-1,2,2,C.SHAD);p(cx,cy,C.VOID);
      }else{
        p(cx,cy,C.VOID);p(cx-1,cy,C.SHAD);p(cx+1,cy,C.SHAD);p(cx,cy-1,C.SHAD);p(cx,cy+1,C.SHAD);
      }
    },
    // Meteor — large fireball → massive explosion ring
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        const r=[4,5,4][f],bob=[0,-1,1][f];
        // Large fireball
        for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r){
          const d=Math.sqrt(x*x+y*y);p(cx+x,cy+y+bob,d<1?C.WHITE:d<r*0.3?C.LTYEL:d<r*0.6?C.ORG:d<r*0.8?C.RED:C.DKRED);
        }
        // Flame trail
        p(cx-r,cy+bob-1,C.RED);p(cx-r-1,cy+bob,C.DKRED);
        if(f>0){p(cx-r-2,cy+bob+1,C.DKRED);}
      }else if(f===3){
        // Massive explosion ring 1
        for(let i=0;i<16;i++){const a=i*Math.PI/8;
          p(cx+Math.round(Math.cos(a)*6),cy+Math.round(Math.sin(a)*6),i%2?C.RED:C.ORG);
          p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),C.LTYEL);
        }
        b(cx-2,cy-2,4,4,C.ORG);b(cx-1,cy-1,2,2,C.WHITE);p(cx,cy,C.WHITE);
      }else if(f===4){
        for(let i=0;i<12;i++){const a=i*Math.PI/6,r=5+i%2;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%3===0?C.ORG:C.DKRED);
        }
        for(let i=0;i<6;i++){const a=i*Math.PI/3;p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.RED);}
        p(cx,cy,C.ORG);
      }else{
        [[3,4],[12,3],[5,12],[10,13],[2,8],[14,7],[7,2],[9,14]].forEach(([x,y],i)=>p(x,y,i%2?C.DKRED:C.RED));
        p(cx,cy,C.DKRED);
      }
    },
    // Arcane Nova — swirling multi-color orb → rainbow nova blast
    (c:CanvasRenderingContext2D,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      const colors=[C.LTVIO,C.LTICE,C.LTYEL,C.LTRED,C.LAV,C.PLLAV,C.PLBLU,C.PLYEL];
      if(f<3){
        const r=[4,4,5][f],rot=f*2;
        // Swirling multi-color orb
        for(let i=0;i<12;i++){const a=(i+rot)*Math.PI/6;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),colors[i%8]);
        }
        for(let i=0;i<6;i++){const a=(i+rot)*Math.PI/3;
          p(cx+Math.round(Math.cos(a)*(r-2)),cy+Math.round(Math.sin(a)*(r-2)),colors[(i+2)%8]);
        }
        b(cx-1,cy-1,2,2,C.PLLAV);p(cx,cy,C.WHITE);
      }else if(f===3){
        // Rainbow nova 1
        for(let i=0;i<16;i++){const a=i*Math.PI/8;
          p(cx+Math.round(Math.cos(a)*6),cy+Math.round(Math.sin(a)*6),colors[i%8]);
          p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),colors[(i+4)%8]);
        }
        b(cx-2,cy-2,4,4,C.PLLAV);b(cx-1,cy-1,2,2,C.WHITE);p(cx,cy,C.WHITE);
      }else if(f===4){
        for(let i=0;i<16;i++){const a=i*Math.PI/8,r=5+i%3;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),colors[i%8]);
        }
        p(cx,cy,C.LTVIO);p(cx-1,cy,C.LTICE);p(cx+1,cy,C.LTYEL);
      }else{
        for(let i=0;i<8;i++){
          const a=i*Math.PI/4;
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),colors[i]);
        }
        p(cx,cy,C.MDVIO);
      }
    },
  ];
  const cols=7,rows=6;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*P_CELL,row*P_CELL],row);
  return{cols,rows,cell:P_CELL};
}

// ===== HERO (8×5 at 64×128) =====
const H_PX=2,H_GW=32,H_GH=64,H_CW=H_GW*H_PX,H_CH=H_GH*H_PX;

function drawHero(ctx:CanvasRenderingContext2D){
  // dir: 0=down,1=side,2=up | opts for animation variants
  function drawChar(c:CanvasRenderingContext2D,o[],dir,opts={}){
    const{p,b}=mk(c,o,H_GW,H_GH,H_PX);
    const{lOff=0,rOff=0,atk=false,atkFrame=0,blink=false,frostNova=false,meteorCh=false,staffThrust=false,hurt=false,armSwing=0}=opts;
    const cx=16;
    const lean=blink?3:atk&&atkFrame>0?1:0;
    const headY=blink?5:7;
    const torY=headY+7;
    const legY=torY+9;
    const bx=cx+lean;

    // Blink afterimage
    if(blink){
      for(let y=0;y<20;y++){const w=y<4?3:y<10?5:3,sx=bx-10-Math.floor(w/2);
        for(let x=0;x<w;x++){const px=sx+x;if(px>=0)p(px,8+y,y%2?C.VOID:C.SHAD);}
      }
      p(bx-8,12,C.MDVIO);p(bx-12,15,C.DVIO);
    }

    // Meteor channel ground marker
    if(meteorCh){
      for(let i=0;i<12;i++){const a=i*Math.PI/6;
        p(bx+Math.round(Math.cos(a)*8),55+Math.round(Math.sin(a)*3),i%2?C.RED:C.ORG);
      }
      b(bx-6,57,12,1,C.DKRED);
    }

    // Frost nova ground ring
    if(frostNova){
      for(let i=0;i<16;i++){const a=i*Math.PI/8;
        p(bx+Math.round(Math.cos(a)*10),50+Math.round(Math.sin(a)*4),i%2?C.ICE:C.LTICE);
        p(bx+Math.round(Math.cos(a)*8),50+Math.round(Math.sin(a)*3),C.WHITE);
      }
    }

    // ROBE (behind body — the main large garment)
    if(dir===2||dir===0){
      const cY=torY+2;
      for(let i=0;i<18;i++){
        const w=6+Math.floor(i*0.6),sx=bx-Math.floor(w/2)+Math.round(Math.sin(i*0.3+(blink?2:0))*0.8);
        const cl=i<4?C.MDVIO:i<10?C.DKVIO:i<14?C.DVIO:C.SHAD;
        for(let x=0;x<w;x++){const px=sx+x;if(px>=0&&px<32&&cY+i<62)p(px,cY+i,cl);}
      }
      // Edge highlights — arcane shimmer
      for(let i=0;i<14;i++){
        const w=6+Math.floor(i*0.6),sx=bx-Math.floor(w/2)+Math.round(Math.sin(i*0.3+(blink?2:0))*0.8);
        if(cY+i<62){p(sx,cY+i,C.BRVIO);if(sx+w-1<32)p(sx+w-1,cY+i,i%3===0?C.BRVIO:C.DKVIO);}
      }
      // Rune marks on robe
      for(let i=4;i<12;i+=3){
        const sx=bx-Math.floor((6+Math.floor(i*0.6))/2);
        if(cY+i<62)p(sx+2,cY+i,C.LAV);
      }
      // Bottom tatter
      const bY=Math.min(cY+16,61);
      for(let x=-6;x<7;x++){const px=bx+x;if(px>=0&&px<32&&(px+bY)%3!==0)p(px,bY,C.SHAD);if(px>=0&&px<32&&(px+bY)%2===0&&bY+1<63)p(px,bY+1,C.VOID);}
    }

    // HOOD — pointed wizard hood
    if(dir===0){
      // Down — front of hood with pointed top
      b(bx-4,headY,8,2,C.DKVIO);b(bx-5,headY+2,10,3,C.DKVIO);
      b(bx-4,headY+1,8,1,C.MDVIO);b(bx-3,headY-1,6,1,C.MDVIO);b(bx-2,headY-2,4,1,C.BRVIO);
      p(bx-1,headY-3,C.BRVIO);p(bx,headY-4,C.LTVIO);p(bx,headY-5,C.PLLAV); // Pointed tip
      // Hood drape
      b(bx+5,headY+3,2,3,C.DKVIO);p(bx+6,headY+2,C.DKVIO);
      // Inner shadow
      b(bx-3,headY+2,6,3,C.VOID);b(bx-4,headY+3,8,2,C.VOID);
      // Glowing eyes
      const eg=staffThrust||meteorCh;
      p(bx-2,headY+3,eg?C.PLLAV:C.LTVIO);p(bx-1,headY+3,eg?C.WHITE:C.PLLAV);
      p(bx+1,headY+3,eg?C.PLLAV:C.LTVIO);p(bx+2,headY+3,eg?C.WHITE:C.PLLAV);
      p(bx-2,headY+4,C.DVIO);p(bx+2,headY+4,C.DVIO);
      b(bx-4,headY,8,1,C.BRVIO);p(bx-5,headY+2,C.BRVIO);
    } else if(dir===1){
      // Side — profile
      b(bx-3,headY,6,2,C.DKVIO);b(bx-4,headY+2,8,3,C.DKVIO);
      b(bx-3,headY+1,5,1,C.MDVIO);b(bx-2,headY-1,4,1,C.MDVIO);b(bx-1,headY-2,3,1,C.BRVIO);
      p(bx,headY-3,C.LTVIO);p(bx,headY-4,C.PLLAV); // Pointed tip
      b(bx+4,headY+3,2,3,C.DKVIO);p(bx+5,headY+2,C.DKVIO);
      b(bx-3,headY+2,5,3,C.VOID);
      // One eye
      const eg=staffThrust||meteorCh;
      p(bx+1,headY+3,eg?C.PLLAV:C.LTVIO);p(bx+2,headY+3,eg?C.WHITE:C.PLLAV);
      p(bx+1,headY+4,C.DVIO);
      b(bx-3,headY,6,1,C.BRVIO);
    } else {
      // Up — back of hood
      b(bx-4,headY,8,5,C.DKVIO);b(bx-3,headY,6,4,C.MDVIO);
      b(bx-3,headY-1,6,1,C.MDVIO);b(bx-2,headY-2,4,1,C.BRVIO);
      p(bx-1,headY-3,C.BRVIO);p(bx,headY-4,C.LTVIO);p(bx,headY-5,C.PLLAV); // Pointed tip
      b(bx+4,headY+3,2,3,C.DKVIO);p(bx+5,headY+2,C.DKVIO);
      b(bx-4,headY,8,1,C.BRVIO);
      // Back rune
      p(bx-1,headY+1,C.LAV);p(bx,headY+2,C.LAV);p(bx+1,headY+1,C.LAV);
    }

    // TORSO (robes)
    b(bx-3,torY,6,8,C.DKVIO);b(bx-2,torY,4,8,C.MDVIO);
    if(dir===0){
      // Chest rune pattern
      p(bx-2,torY+1,C.BRVIO);p(bx-1,torY+2,C.LAV);p(bx,torY+3,C.BRVIO);p(bx+1,torY+2,C.LAV);p(bx+2,torY+1,C.BRVIO);
    } else if(dir===1){
      p(bx,torY+1,C.BRVIO);p(bx+1,torY+2,C.LAV);p(bx,torY+3,C.BRVIO);
    } else {
      p(bx-1,torY+1,C.BRVIO);p(bx,torY+2,C.LAV);p(bx+1,torY+1,C.BRVIO);
    }
    // Sash / belt
    b(bx-3,torY+7,6,1,C.GRAY);b(bx-2,torY+7,4,1,C.DKGRAY);p(bx,torY+7,C.LAV);

    // ARMS & STAFF
    if(atk){
      if(dir===0){
        // Staff thrust down
        if(atkFrame===0){
          b(bx+3,torY-2,2,3,C.DKVIO);b(bx+4,torY-3,1,12,C.DKGRAY);p(bx+4,torY-3,C.GRAY);
          // Crystal tip glow
          p(bx+4,torY-4,C.LTVIO);p(bx+4,torY-5,C.PLLAV);p(bx+3,torY-5,C.LAV);p(bx+5,torY-5,C.LAV);p(bx+4,torY-6,C.WHITE);
        }else{
          b(bx+3,torY+2,2,3,C.DKVIO);
          // Staff thrusted forward/down
          for(let i=0;i<8;i++)p(bx+5,torY+6+i,i===0?C.GRAY:C.DKGRAY);
          // Crystal burst at impact
          p(bx+5,torY+14,C.LTVIO);p(bx+4,torY+15,C.PLLAV);p(bx+6,torY+15,C.PLLAV);p(bx+5,torY+16,C.WHITE);
          for(let i=0;i<4;i++){const a=i*Math.PI/2;p(bx+5+Math.round(Math.cos(a)*2),torY+15+Math.round(Math.sin(a)*2),C.LAV);}
        }
        b(bx-5,torY+2,2,4,C.DKVIO);
      } else if(dir===1){
        if(atkFrame===0){
          b(bx+3,torY-1,3,2,C.DKVIO);b(bx+5,torY-6,1,8,C.DKGRAY);p(bx+5,torY-6,C.GRAY);
          p(bx+5,torY-7,C.LTVIO);p(bx+5,torY-8,C.PLLAV);p(bx+4,torY-8,C.LAV);p(bx+6,torY-8,C.LAV);p(bx+5,torY-9,C.WHITE);
        }else{
          b(bx+3,torY+1,3,2,C.DKVIO);
          for(let i=0;i<8;i++){const x_=bx+6+Math.floor(i*0.3),y_=torY+4+i;if(x_<32&&y_<63)p(x_,y_,i===0?C.GRAY:C.DKGRAY);}
          p(bx+8,torY+12,C.LTVIO);p(bx+7,torY+13,C.PLLAV);p(bx+9,torY+13,C.PLLAV);p(bx+8,torY+14,C.WHITE);
        }
      } else {
        if(atkFrame===0){
          b(bx+3,torY-2,2,3,C.DKVIO);b(bx+4,torY-7,1,8,C.DKGRAY);
          p(bx+4,torY-8,C.LTVIO);p(bx+4,torY-9,C.PLLAV);p(bx+4,torY-10,C.WHITE);
        }else{
          b(bx+3,torY+3,2,3,C.DKVIO);
          for(let i=0;i<6;i++)p(bx+4,torY+7+i,C.DKGRAY);
          p(bx+4,torY+13,C.LTVIO);p(bx+4,torY+14,C.PLLAV);
        }
      }
    } else {
      // idle/walk — staff held at side
      const aY=torY+1;
      if(dir===0){
        b(bx-5,aY+armSwing,2,5,C.DKVIO);p(bx-5,aY+armSwing,C.MDVIO);
        b(bx+3,aY-armSwing,2,5,C.DKVIO);p(bx+4,aY-armSwing,C.MDVIO);
        // Staff
        for(let i=0;i<10;i++)p(bx+5,aY-armSwing-2+i,i===0?C.GRAY:C.DKGRAY);
        p(bx+5,aY-armSwing-3,C.LTVIO);p(bx+5,aY-armSwing-4,C.PLLAV);p(bx+5,aY-armSwing-5,C.WHITE);
      } else if(dir===1){
        b(bx+3,aY-armSwing,2,5,C.DKVIO);p(bx+4,aY-armSwing,C.MDVIO);
        for(let i=0;i<10;i++)p(bx+5,aY-armSwing-2+i,i===0?C.GRAY:C.DKGRAY);
        p(bx+5,aY-armSwing-3,C.LTVIO);p(bx+5,aY-armSwing-4,C.PLLAV);p(bx+5,aY-armSwing-5,C.WHITE);
      } else {
        b(bx-5,aY+armSwing,2,5,C.DKVIO);p(bx-5,aY+armSwing,C.MDVIO);
        b(bx+3,aY-armSwing,2,5,C.DKVIO);p(bx+4,aY-armSwing,C.MDVIO);
      }
    }

    // LEGS
    const lh=10;
    b(bx-2+lOff,legY,2,lh,C.DKVIO);p(bx-1+lOff,legY,C.MDVIO);
    b(bx+1+rOff,legY,2,lh,C.DKVIO);p(bx+2+rOff,legY,C.MDVIO);
    // Knee guards
    b(bx-2+lOff,legY+Math.floor(lh*0.5),2,1,C.GRAY);
    b(bx+1+rOff,legY+Math.floor(lh*0.5),2,1,C.GRAY);
    // Boots
    const lfy=Math.min(legY+lh,61),rfy=Math.min(legY+lh,61);
    b(bx-3+lOff,lfy,4,2,C.MDVIO);b(bx-3+lOff,lfy,3,1,C.BRVIO);
    b(bx+rOff,rfy,4,2,C.MDVIO);b(bx+1+rOff,rfy,3,1,C.BRVIO);
    // Ground wisps
    if(!blink&&lfy+2<63){p(bx-3+lOff,lfy+2,C.SHAD);p(bx+3+rOff,rfy+2,C.SHAD);}

    // Hurt flash
    if(hurt){p(bx+4,headY+1,C.RED);p(bx+5,headY,C.LTRED);p(bx+6,headY+1,C.RED);p(bx+5,headY+2,C.LTRED);}

    // Blink phase lines
    if(blink)for(let y=headY-2;y<legY+8;y+=3){p(bx-7,y,C.MDVIO);p(bx+7,y+1,C.MDVIO);}
  }

  // Layout: 8 cols × 5 rows at 64×128
  // R0: Down  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R1: Side  idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R2: Up    idle1,idle2,walk1,walk2,walk3,walk4,atk1,atk2
  // R3: Abilities staffThrust, frostNova, blink, meteorChannel, + 4 effect frames
  // R4: hurt, death1, death2, portrait, empty×4

  const frames[]=[];
  // Per-direction rows
  for(let dir=0;dir<3;dir++){
    frames.push([
      {dir,opts:{}},
      {dir,opts:{armSwing:1}},
      {dir,opts:{lOff:1,rOff:-1,armSwing:1}},
      {dir,opts:{lOff:-1,rOff:1,armSwing:-1}},
      {dir,opts:{lOff:2,rOff:0,armSwing:1}},
      {dir,opts:{lOff:0,rOff:2,armSwing:-1}},
      {dir,opts:{atk:true,atkFrame:0,lOff:1}},
      {dir,opts:{atk:true,atkFrame:1,lOff:2,rOff:-1}},
    ]);
  }
  // Abilities
  frames.push([
    {dir:0,opts:{staffThrust:true,atk:true,atkFrame:0,lOff:1}},
    {dir:0,opts:{staffThrust:true,atk:true,atkFrame:1,lOff:2,rOff:-1}},
    {dir:0,opts:{frostNova:true}},
    {dir:0,opts:{frostNova:true,armSwing:1}},
    {dir:1,opts:{blink:true,lOff:2,rOff:1}},
    {dir:1,opts:{blink:true,lOff:3,rOff:2}},
    {dir:0,opts:{meteorCh:true}},
    {dir:0,opts:{meteorCh:true,armSwing:1,lOff:1,rOff:-1}},
  ]);
  // States
  frames.push([
    {dir:0,opts:{hurt:true,lOff:-1,rOff:-1}},
    {dir:0,opts:{custom:'death1'}},
    {dir:0,opts:{custom:'death2'}},
    {dir:0,opts:{custom:'portrait'}},
    null,null,null,null,
  ]);

  const cols=8,rows=5;
  frames.forEach((row,ry)=>{
    row.forEach((frame,rx)=>{
      if(!frame)return;
      const o=[rx*H_CW,ry*H_CH];
      if(frame.opts.custom==='death1'){
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Collapsed mage on ground
        b(6,30,5,4,C.DKVIO);b(7,31,3,2,C.MDVIO);b(6,30,5,1,C.BRVIO);p(8,32,C.LTVIO);p(9,32,C.MDVIO);
        b(10,32,10,4,C.DKVIO);b(11,32,8,3,C.MDVIO);
        // Scattered robe
        b(4,33,3,2,C.LTVIO);b(3,34,2,1,C.BRVIO);p(2,35,C.MDVIO);
        // Staff on ground
        b(20,34,6,1,C.DKGRAY);p(20,34,C.GRAY);p(26,34,C.LTVIO);p(27,34,C.PLLAV);
        // Crystal glow fading
        p(27,33,C.LAV);p(28,34,C.MDVIO);
        b(8,36,14,3,C.DKVIO);b(7,37,16,2,C.SHAD);
        for(let x=6;x<24;x++){if(x%3!==0)p(x,39,C.SHAD);if(x%4===0)p(x,40,C.VOID);}
        [[8,26,C.MDVIO],[14,24,C.SHAD],[20,27,C.DKVIO],[11,22,C.SHAD],[17,25,C.MDVIO]].forEach(([x,y,cl])=>p(x as number,y as number,cl as string));
      } else if(frame.opts.custom==='death2'){
        const{p}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Dissolving into arcane particles
        for(let x=8;x<24;x++){if(x%2===0)p(x,42,C.SHAD);if(x%3===0)p(x,41,C.DKVIO);}
        p(22,36,C.LTVIO);p(22,35,C.PLLAV);p(22,41,C.MDVIO);p(7,40,C.LAV);p(8,41,C.BRVIO);p(6,41,C.MDVIO);
        [[10,35],[14,32],[18,37],[12,28],[20,30],[8,33],[16,26],[22,28],[11,24],[15,22],[19,34],[13,38],[17,40],[9,36],[21,32],[14,20],[16,18],[12,16],[18,24],[10,30]].forEach(([x,y],i)=>{
          p(x,y,i%5===0?C.PLLAV:i%4===0?C.LTVIO:i%3===0?C.BRVIO:i%2===0?C.MDVIO:C.SHAD);
        });
        p(14,42,C.LAV);p(15,42,C.MDVIO);
      } else if(frame.opts.custom==='portrait'){
        const{p,b}=mk(ctx,o,H_GW,H_GH,H_PX);
        // Portrait — close-up face
        b(2,2,28,60,C.VOID);b(3,3,26,58,C.SHAD);
        // Hood
        b(6,6,20,8,C.DKVIO);b(7,7,18,6,C.MDVIO);b(6,6,20,2,C.BRVIO);b(7,5,18,2,C.MDVIO);b(8,4,16,2,C.BRVIO);b(10,3,12,1,C.LTVIO);
        // Pointed top
        p(15,2,C.PLLAV);p(16,2,C.LTVIO);
        p(26,8,C.DKVIO);p(27,9,C.SHAD);p(28,10,C.SHAD);p(27,10,C.DKVIO);
        // Face void
        b(8,10,16,10,C.VOID);b(9,11,14,8,C.VOID);
        // Glowing eyes
        b(9,14,5,3,C.MDVIO);b(10,14,3,2,C.LTVIO);b(11,14,1,2,C.PLLAV);p(11,14,C.WHITE);
        b(18,14,5,3,C.MDVIO);b(19,14,3,2,C.LTVIO);b(20,14,1,2,C.PLLAV);p(20,14,C.WHITE);
        // Eye glow trails
        p(8,16,C.MDVIO);p(7,17,C.DVIO);p(23,16,C.MDVIO);p(24,17,C.DVIO);
        // Chin area
        b(12,19,8,1,C.DKVIO);
        // Robe collar
        b(7,21,18,6,C.DKVIO);b(8,22,16,4,C.MDVIO);b(9,23,14,2,C.BRVIO);
        // Rune patterns on collar
        b(10,22,2,4,C.DKVIO);b(18,22,2,4,C.DKVIO);b(14,22,1,4,C.LAV);
        // Shoulder pauldrons
        b(4,20,4,6,C.DKVIO);b(5,20,2,5,C.MDVIO);b(24,20,4,6,C.DKVIO);b(25,20,2,5,C.MDVIO);
        // Robe body
        b(8,27,16,14,C.DKVIO);b(9,27,14,12,C.MDVIO);
        // Chest runes
        p(10,29,C.BRVIO);p(12,30,C.LAV);p(14,31,C.BRVIO);p(16,30,C.LAV);p(18,29,C.BRVIO);
        // Staff
        b(24,28,2,10,C.DKGRAY);p(25,27,C.PLLAV);p(24,26,C.LTVIO);p(25,25,C.WHITE);
        // Border
        b(2,2,28,1,C.BRVIO);b(2,61,28,1,C.BRVIO);b(2,2,1,60,C.BRVIO);b(29,2,1,60,C.BRVIO);
        p(3,3,C.LAV);p(28,3,C.LAV);p(3,60,C.LAV);p(28,60,C.LAV);
      } else {
        drawChar(ctx,o,frame.dir,frame.opts);
      }
    });
  });
  return{cols,rows,cw:H_CW,ch:H_CH};
}

    const ppc=ppv.getContext('2d')!;ppc.imageSmoothingEnabled=false;
    ppc.fillStyle='#07050c';ppc.fillRect(0,0,ppv.width,ppv.height);
    for(let r=0;r<6;r++){const by=r*(P_CELL*pS+tLH)+5;ppc.fillStyle='#6644ff';ppc.font='bold 9px monospace';ppc.fillText(P_STATES[r],3,by+P_CELL*pS/2+3);
      for(let cc=0;cc<7;cc++){const bx=tLW+cc*P_CELL*pS;ppc.save();ppc.translate(bx,by);ppc.scale(pS,pS);ppc.drawImage(pc,cc*P_CELL,r*P_CELL,P_CELL,P_CELL,0,0,P_CELL,P_CELL);ppc.restore();ppc.strokeStyle='#1a1a2a';ppc.strokeRect(bx,by,P_CELL*pS,P_CELL*pS);if(r===0){ppc.fillStyle='#9988ff';ppc.font='9px monospace';ppc.fillText(P_NAMES[cc],bx+2,by-2);}}}

    // Hero
    const hc=hRef.current!;hc.width=8*H_CW;hc.height=5*H_CH;
    const hCtx=hc.getContext('2d')!;hCtx.imageSmoothingEnabled=false;
    drawHero(hCtx);
    const hpv=hPv.current!;const hS=1.4,hLW=72,hLH=13;

  const dl=(ref:React.RefObject,name)=>()=>{const a=document.createElement('a');a.download=name;a.href=ref.current!.toDataURL('image/png');a.click();};

  const tabs=[
    {id:'towers',label:'Towers',ref:tRef,pvRef:tPv,dl:'arcane_towers_animated.png',
      info:{sz:'448×256',cell:'64×64',loader:"this.load.spritesheet('arcane_towers','arcane_towers_animated.png',{frameWidth:64,frameHeight:64})",note:'7 cols (towers) × 4 rows (idle, charge, fire, cooldown)'}},
    {id:'projectiles',label:'Projectiles',ref:pRef,pvRef:pPv,dl:'arcane_projectiles_animated.png',

  BRONZE:'#cc8833',DKBRZ:'#995522',LTBRZ:'#ddaa55',
  TAN:'#eebb66',LTTAN:'#ffdd88',DKTAN:'#bb9944',
  ORANGE:'#ff9944',LTORG:'#ffbb77',DKORG:'#cc6622',
  DKBRN:'#332211',BRWN:'#553322',MDBRN:'#664433',
  STEEL:'#888888',LTSTL:'#aaaaaa',DKSTL:'#666666',WTSTL:'#cccccc',
  RIVET:'#555555',DKRIV:'#444444',
  FLAME:'#ff6622',LTFLM:'#ffaa44',WFLM:'#ffdd88',DKFLM:'#cc3300',
  BLUE:'#4488ff',LTBLU:'#88bbff',WBLU:'#bbddff',DKBLU:'#2255aa',
  SPARK:'#ffff88',WSPARK:'#ffffff',LTSPARK:'#ffee66',
  BLACK:'#111111',VOID:'#000000',
  WHITE:'#ffffff',GRAY:'#777777',DKGRAY:'#333333',

  RED:'#cc3333',LTRED:'#ff5555',DKRED:'#882222',
};

// ===== DRAWING HELPERS =====
const mk=(c,o[],gw,gh,ps)=>{
  const p=(x,y,cl)=>{if(!cl||x<0||x>=gw||y<0||y>=gh)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,ps,ps);};
  const b=(x,y,w,h,cl)=>{if(!cl)return;c.fillStyle=cl;c.fillRect(o[0]+x*ps,o[1]+y*ps,w*ps,h*ps);};
  return{p,b};
};

// ===== TOWER HELPERS =====
const T_PX=2,T_G=32,T_CELL=T_G*T_PX;

// Mechanical base: stacked metal platform with gear teeth and rivets
function mBase(p,b,topY,w,glow){
  const cx=16;
  // Main platform layers
  for(let i=0;i<10;i++){
    const cw=w-4+Math.floor(i*0.6),sx=cx-Math.floor(cw/2);
    b(sx,topY+i,cw,1,i<2?C.LTBRZ:i<4?C.BRONZE:i<7?C.DKBRZ:C.DKBRN);
  }
  // Top edge highlight
  b(cx-Math.floor((w-4)/2),topY,w-4,1,C.TAN);
  // Gear teeth pattern along top edge
  const gw=w-6,gsx=cx-Math.floor(gw/2);
  for(let i=0;i<gw;i++){
    if(i%3===0){p(gsx+i,topY-1,glow>1?C.LTGEAR:C.GEAR);p(gsx+i,topY,C.LTGEAR);}
  }
  // Gear teeth on sides
  for(let i=0;i<6;i+=2){
    p(cx-Math.floor(w/2)+1,topY+2+i,glow>0?C.LTGEAR:C.GEAR);
    p(cx+Math.floor(w/2)-2,topY+2+i,glow>0?C.LTGEAR:C.GEAR);
  }
  // Rivets
  p(cx-4,topY+2,glow>1?C.WTSTL:C.LTSTL);p(cx+3,topY+2,glow>1?C.WTSTL:C.LTSTL);
  p(cx-3,topY+5,C.RIVET);p(cx+2,topY+5,C.RIVET);
  p(cx-5,topY+7,C.DKRIV);p(cx+4,topY+7,C.DKRIV);
  // Bottom shadow
  b(cx-Math.floor((w-2)/2),topY+9,w-2,1,C.DKBRN);
  // Steam vent (small)
  if(glow>0){p(cx-2,topY+3,C.SMOKE);p(cx-2,topY+2,C.LTSMK);}
}

// Piston helper
function mPiston(p,b,x,y,h,ext){
  // Outer cylinder
  b(x,y,3,h,C.DKSTL);b(x+1,y,1,h,C.STEEL);
  // Inner rod
  b(x+1,y-ext,1,ext+2,C.LTSTL);
  // Cap
  b(x,y-ext-1,3,1,C.WTSTL);
  // Base mount
  b(x-1,y+h-1,5,1,C.DKBRN);
}

// Gear helper
function mGear(p,cx,cy,r,col,teeth){
  // Core circle
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    if(x*x+y*y<=r*r)p(cx+x,cy+y,col);
  }
  // Teeth
  for(let i=0;i<teeth;i++){
    const a=i*Math.PI*2/teeth;
    const tx=Math.round(Math.cos(a)*(r+1)),ty=Math.round(Math.sin(a)*(r+1));
    p(cx+tx,cy+ty,col);
  }
  // Center hole
  if(r>1)p(cx,cy,C.DKBRN);
}

// Steam puff helper
function mSteam(p,x,y,size){
  for(let i=0;i<size;i++){
    const ox=Math.round(Math.sin(i*1.2)*2),oy=-i;
    p(x+ox,y+oy,i<size/2?C.LTSMK:C.SMOKE);
    if(i>0)p(x+ox+1,y+oy,C.SMOKE);
  }
}

        // Capacitor discharge

      mGear(p,25,17,2,C.GEAR,6);
      // Exhaust pipes (back/left side)
      b(3,11,3,2,C.DKSTL);b(3,11,3,1,C.STEEL);

      if(s===1){

        b(10,10,12,1,C.TAN);
        // Exhaust steam
        mSteam(p,2,10,4);mSteam(p,2,14,3);

      if(s===2){

        // Middle barrel flash (biggest)
        b(31,12,1,7,C.SPARK);p(31,14,C.WSPARK);p(31,15,C.WHITE);p(31,16,C.WSPARK);
        b(30,13,1,5,C.LTFLM);
        // Bottom barrel flash
        b(30,18,2,4,C.SPARK);p(31,19,C.WSPARK);p(30,22,C.FLAME);
        // Smoke clouds
        p(28,8,C.SMOKE);p(29,7,C.LTSMK);p(28,22,C.SMOKE);p(29,23,C.LTSMK);

        b(1,10,2,3,C.SMOKE);b(1,14,2,3,C.SMOKE);
        p(0,11,C.LTSMK);p(0,15,C.LTSMK);

      }
      if(s===3){
        // Cooldown: heavy smoke, heat dissipation
        mSteam(p,29,8,6);mSteam(p,30,14,5);mSteam(p,29,18,6);

        p(28,11,C.DKSMK);p(28,15,C.DKSMK);p(28,19,C.DKSMK);
        // Gears cooling
        p(7,17,C.DKSTL);p(25,17,C.DKSTL);
      }
    },
  ];
  const cols=8,rows=4;
  for(let col=0;col<cols;col++)for(let row=0;row<rows;row++)fns[col](ctx,[col*T_CELL,row*T_CELL],row);
  return{cols,rows,cell:T_CELL};
}

// ===== PROJECTILES (8×6 at 32×32) =====
const P_PX=2,P_G=16,P_CELL=P_G*P_PX;

function drawProjectiles(ctx:CanvasRenderingContext2D){
  const fns=[
    // 0: Wall — ricochet spark
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Spark traveling
        const size=[2,3,2][f],bob=[0,-1,1][f];
        for(let i=-size;i<=size;i++){
          p(cx+i,cy+bob,Math.abs(i)===size?C.DKORG:Math.abs(i)>0?C.ORANGE:C.SPARK);
        }
        p(cx,cy-1+bob,C.SPARK);p(cx,cy+1+bob,C.ORANGE);
        // Trail
        if(f>0){p(cx-3-f,cy,C.DKORG);p(cx-4-f,cy+1,C.DKBRN);}
      } else if(f===3){
        // Impact: spark burst
        for(let i=0;i<8;i++){
          const a=i*Math.PI/4;
          p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),i%2?C.SPARK:C.ORANGE);
          p(cx+Math.round(Math.cos(a)*2),cy+Math.round(Math.sin(a)*2),C.WSPARK);
        }
        p(cx,cy,C.WHITE);
      } else if(f===4){
        // Fade
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3;
          p(cx+Math.round(Math.cos(a)*5),cy+Math.round(Math.sin(a)*5),C.DKORG);
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),C.ORANGE);
        }
        p(cx,cy,C.SPARK);
      } else {
        // Final fade
        p(cx,cy,C.DKORG);p(cx-2,cy-1,C.DKBRN);p(cx+2,cy+1,C.DKBRN);
      }
    },
    // 1: Turret — bullet tracer
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Bullet in flight
        const len=[4,5,4][f];
        b(cx-1,cy,len,1,C.LTSTL);b(cx,cy,len-1,1,C.WTSTL);
        p(cx+len-1,cy,C.SPARK);
        // Tracer trail
        for(let i=1;i<=3;i++)p(cx-1-i,cy,i===1?C.ORANGE:i===2?C.DKORG:C.DKBRN);
        if(f>0)p(cx-5,cy+1,C.SMOKE);
      } else if(f===3){
        // Hit spark
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3;
          p(cx+Math.round(Math.cos(a)*3),cy+Math.round(Math.sin(a)*3),i%2?C.SPARK:C.ORANGE);
        }

        b(cx-1,cy-1,2,2,C.SPARK);
      } else if(f===4){
        for(let i=0;i<4;i++){const a=i*Math.PI/2;p(cx+Math.round(Math.cos(a)*4),cy+Math.round(Math.sin(a)*4),C.DKORG);}
        p(cx,cy,C.ORANGE);
      } else {
        p(cx,cy,C.DKORG);p(cx-1,cy,C.DKBRN);p(cx+1,cy,C.DKBRN);
      }
    },
    // 2: Flamethrower — flame ball
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
      if(f<3){
        // Fireball growing

        for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
          if(x*x+y*y<=r*r){
            const d=Math.sqrt(x*x+y*y);
            p(cx+x,cy+y,d<1?C.WFLM:d<r*0.5?C.LTFLM:d<r*0.8?C.FLAME:C.DKFLM);
          }
        }
        p(cx,cy-r,C.SPARK);
        // Embers trail
        if(f>0){p(cx-r-1,cy+1,C.DKFLM);p(cx-r-2,cy,C.DKORG);}
        if(f===2){p(cx+1,cy-r-1,C.FLAME);p(cx-1,cy-r-1,C.ORANGE);}
      } else if(f===3){
        // Fire burst
        for(let i=0;i<10;i++){
          const a=i*Math.PI/5,r=4+i%2;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%2?C.FLAME:C.LTFLM);
          p(cx+Math.round(Math.cos(a)*(r-2)),cy+Math.round(Math.sin(a)*(r-2)),C.WFLM);
        }
        b(cx-1,cy-1,2,2,C.WHITE);p(cx,cy,C.WSPARK);
      } else if(f===4){
        // Expanding fire
        for(let i=0;i<8;i++){

      } else {
        // Smoke remains
        for(let i=0;i<5;i++){p(cx-2+i,cy+i%2,C.SMOKE);p(cx-1+i,cy-1+i%2,C.DKSMK);}
        p(cx,cy,C.DKFLM);

    },
    // 3: Tesla — lightning arc
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;

        for(let i=0;i<Math.min(len,zigzag.length);i++){

        }
        // Side sparks
        if(f>0){p(cx-2,cy-2,C.SPARK);p(cx+1,cy+2,C.SPARK);}
        if(f===2){p(cx-3,cy+2,C.LTBLU);p(cx+3,cy-2,C.LTBLU);}

        for(let i=0;i<8;i++){
          const a=i*Math.PI/4;
          const r=3+i%2;
          p(cx+Math.round(Math.cos(a)*r),cy+Math.round(Math.sin(a)*r),i%2?C.LTBLU:C.WBLU);
          if(i%2===0)p(cx+Math.round(Math.cos(a)*(r+2)),cy+Math.round(Math.sin(a)*(r+2)),C.SPARK);

    },
    // 4: Mortar — falling shell
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;

        if(f>0){p(cx,cy-4+drop,C.SMOKE);p(cx-1,cy-5+drop,C.LTSMK);}

    // 5: Shredder — spinning blade disc
    (c,o[],f)=>{const{p,b}=mk(c,o,P_G,P_G,P_PX);const cx=8,cy=8;
